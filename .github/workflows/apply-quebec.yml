100422_VOILA_9ee634be63c229f80dc8e7812ce9b26aa01ba403.JPG"}')
          out = "ios-bitewise/Lemora/Resources/FoodPhotos"
          os.makedirs(out, exist_ok=True)
          ok = 0
          for key, url in PICKS.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Lemora/1.0 (+data attribution: epiceries.ca)"})
                  im = Image.open(io.BytesIO(urllib.request.urlopen(req, timeout=60).read())).convert("RGBA")
                  bg = Image.new("RGB", im.size, "white"); bg.paste(im, mask=im.split()[3])
                  bg.thumbnail((480, 480))
                  bg.save(f"{out}/food-{key}.webp", "WEBP", quality=80, method=6)
                  ok += 1
              except Exception as e:
                  print("photo failed", key, e)
          print("food photos", ok, "/", len(PICKS))
          if ok < len(PICKS) - 5:
              sys.exit("too many photo downloads failed")
