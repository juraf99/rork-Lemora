name: US deals from Instacart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-deals.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call the US price service for ZIP codes
        run: |
          set -e
          f=ios-bitewise/Lemora/Services/SupabaseService.swift
          python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          old_url = 'guard let url = URL(string: "\\(LemoraBackend.projectURL.absoluteString)/functions/v1/flipp-direct-ingest") else { return }\n        var request = URLRequest(url: url, timeoutInterval: 8)'
          new_url = ('// US ZIP codes use Instacart store prices: the first visit of an area takes about 40 s, then it is cached.\n'
                     '        let isZip = postal.first?.isNumber == true\n'
                     '        let service = isZip ? "instacart-us" : "flipp-direct-ingest"\n'
                     '        guard let url = URL(string: "\\(LemoraBackend.projectURL.absoluteString)/functions/v1/\\(service)") else { return }\n'
                     '        var request = URLRequest(url: url, timeoutInterval: isZip ? 75 : 8)')
          old_body = 'request.httpBody = try? JSONSerialization.data(withJSONObject: ["ensurePostal": postal])'
          new_body = 'request.httpBody = try? JSONSerialization.data(withJSONObject: isZip ? ["zip": postal] : ["ensurePostal": postal])'
          assert s.count(old_url) == 1 and s.count(old_body) == 1, "anchors not found"
          s = s.replace(old_url, new_url).replace(old_body, new_body)
          open(p, "w").write(s)
          PY
          grep -n "instacart-us\|isZip" "$f"
          git rm -f .github/workflows/us-deals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "US ZIP codes: weekly deals from Instacart store prices"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
