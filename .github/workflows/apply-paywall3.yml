name: Paywall yearly trial and gradient

# One-shot: TestFlight always shows the yearly free-trial design; smooth top gradient. Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-paywall3.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          cat > /tmp/edits.py <<'PYEOF'
          """Paywall: TestFlight always shows the yearly free-trial design (Today / Day 2 / Day 3); one smooth yellow
          gradient from the very top of the screen (no white band under the status bar)."""
          import sys

          R = "ios-bitewise/Lemora/"
          EDITS = []

          def edit(path, old, new, count=1):
              EDITS.append((R + path, old, new, count))

          edit("Services/SubscriptionService.swift",
          """    static let entitlementId = "lemora_pro"
          """,
          """    static let entitlementId = "lemora_pro"
              /// TestFlight / sandbox build: purchases are free tests.
              static var isTestFlight: Bool { Bundle.main.appStoreReceiptURL?.lastPathComponent == "sandboxReceipt" }
          """)

          F = "Views/Onboarding/OnboardingFinal.swift"
          edit(F,
          """    private var trialDays: Int? {
                  guard let product = sub.annual else { return nil }""",
          """    private var trialDays: Int? {
                  if SubscriptionService.isTestFlight {
                      // TestFlight purchases are free tests, so testers always see the yearly free-trial design,
                      // even on an Apple ID that already used the trial. The App Store build checks eligibility.
                      return sub.annual.flatMap { SubscriptionService.trialDays(of: $0) } ?? 3
                  }
                  guard let product = sub.annual else { return nil }""")

          edit(F,
          """        .frame(minHeight: 190, maxHeight: 270)
                  .frame(maxWidth: .infinity)
                  .background {
                      LinearGradient(colors: [Color(hex: 0xFCEFB4), OB.cream], startPoint: .top, endPoint: .bottom)
                          .ignoresSafeArea(edges: .top)
                  }""",
          """        .frame(minHeight: 190, maxHeight: 270)
                  .frame(maxWidth: .infinity)""")

          edit(F,
          """        .background(OB.cream.ignoresSafeArea())
                  .overlay(alignment: .topTrailing) {
                      // TEMPORARY (beta)""",
          """        .background {
                      // One gradient from the very top (status bar included) down into the cream, like the design.
                      ZStack {
                          OB.cream
                          LinearGradient(colors: [Color(hex: 0xFCEFB4), OB.cream], startPoint: .top, endPoint: UnitPoint(x: 0.5, y: 0.36))
                      }
                      .ignoresSafeArea()
                  }
                  .overlay(alignment: .topTrailing) {
                      // TEMPORARY (beta)""")

          def main(root="."):
              import os
              files = {}
              for path, old, new, count in EDITS:
                  p = os.path.join(root, path)
                  s = files.get(p) or open(p, encoding="utf-8").read()
                  n = s.count(old)
                  if n != count:
                      sys.exit(f"Anchor found {n}x (expected {count}) in {path}:\n{old[:120]}")
                  files[p] = s.replace(old, new)
              for p, s in files.items():
                  open(p, "w", encoding="utf-8").write(s)
                  print("edited", p)

          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-paywall3.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Paywall: yearly free-trial design in TestFlight, one smooth gradient under the status bar"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
