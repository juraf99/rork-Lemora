name: Multiple goals and cuisines default

# One-shot: several goals can be picked; cuisines start on "I love it all". Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-goals.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          cat > /tmp/edits.py <<'PYEOF'
          """Several goals can be picked (onboarding + Profile); recommendations use the best-matching goal.
          Cuisines start on "I love it all" instead of Italian + Mexican."""
          import sys

          R = "ios-bitewise/Lemora/"
          EDITS = []

          def edit(path, old, new, count=1):
              EDITS.append((R + path, old, new, count))

          # --- Profile model ---
          edit("Models/UserData.swift",
          """    var goal: Goal = .saveMoney
          """,
          """    var goal: Goal = .saveMoney
              /// Every goal the user picked (multi-select). `goal` stays the first one; empty on older profiles.
              var goals: Set<Goal> = []
          """)
          edit("Models/UserData.swift",
          """        goal = try c.decodeIfPresent(Goal.self, forKey: .goal) ?? .saveMoney
          """,
          """        goal = try c.decodeIfPresent(Goal.self, forKey: .goal) ?? .saveMoney
                  goals = (try? c.decodeIfPresent(Set<Goal>.self, forKey: .goals)) ?? []
          """)
          edit("Models/UserData.swift",
          """    var postalCode: String { location.postalCode }
          """,
          """    var postalCode: String { location.postalCode }

              /// Primary goal first, then the other picked goals.
              var allGoals: [Goal] {
                  [goal] + goals.filter { $0 != goal }.sorted { $0.rawValue < $1.rawValue }
              }
          """)

          # --- Recommendations: score each picked goal, keep the best ---
          E = "Services/RecommendationEngine.swift"
          edit(E,
          """        var goalScore = 0.6
                  switch profile.goal {""",
          """        var goalScore = 0.6
                  var bestGoalScore = 0.0
                  for activeGoal in profile.allGoals {
                  goalScore = 0.6
                  switch activeGoal {""")
          edit(E,
          """            if profile.goal == .gainWeight && n.calories >= 550""",
          """            if activeGoal == .gainWeight && n.calories >= 550""")
          edit(E,
          """        case .maintain, .discover, .other:
                      goalScore = 0.6
                  }
          """,
          """        case .maintain, .discover, .other:
                      goalScore = 0.6
                  }
                  bestGoalScore = max(bestGoalScore, goalScore)
                  }
                  goalScore = bestGoalScore
          """)

          # --- Onboarding model ---
          O = "Views/Onboarding/"
          M = O + "OnboardingModel.swift"
          edit(M,
          """    var goal: String = "save_money"
          """,
          """    var goal: String = "save_money"
              /// Every goal picked (multi-select); `goal` stays the first one. nil on older saves.
              var goals: [String]? = nil
          """)
          edit(M,
          """    var cuisines: [String] = ["italian", "mexican"]""",
          """    var cuisines: [String] = ["all"]""")
          edit(M,
          """    func setGoal(_ id: String) { a.goal = id; react() }""",
          """    /// Goals are multi-select; at least one always stays picked.
              func setGoal(_ id: String) {
                  var picked = a.goals ?? [a.goal]
                  if picked.contains(id) {
                      if picked.count > 1 { picked.removeAll { $0 == id } }
                  } else {
                      picked.append(id)
                  }
                  a.goals = picked
                  a.goal = picked.first ?? id
                  react()
              }

              var selectedGoals: [String] { a.goals ?? [a.goal] }

              var goalLabels: String {
                  selectedGoals.compactMap { id in OBCatalog.goals.first { $0.id == id }?.label }.joined(separator: ", ")
              }""")
          edit(M,
          """    var isBodyGoal: Bool { ["lose_weight", "build_muscle", "gain_weight", "maintain_weight"].contains(a.goal) }""",
          """    var isBodyGoal: Bool { selectedGoals.contains { ["lose_weight", "build_muscle", "gain_weight", "maintain_weight"].contains($0) } }""")

          edit(O + "OnboardingAuth.swift",
          """        p.goal = goals[a.goal] ?? .saveMoney
          """,
          """        p.goal = goals[a.goal] ?? .saveMoney
                  p.goals = Set(selectedGoals.compactMap { goals[$0] })
          """)

          S = O + "OnboardingSteps.swift"
          edit(S,
          """        case .goal: return ("What’s your main goal?", "This shapes everything I recommend.", .idea)""",
          """        case .goal: return ("What are your goals?", "Pick all that apply. This shapes everything I recommend.", .idea)""")
          edit(S,
          """                let on = m.a.goal == g.id""",
          """                let on = m.selectedGoals.contains(g.id)""")
          edit(S,
          """                            Text(g.sub).font(OB.font(12, 400)).foregroundStyle(OB.sub)
                                  }
                                  .frame(maxWidth: .infinity, alignment: .leading)
                                  OBRadio(on: on)""",
          """                            Text(g.sub).font(OB.font(12, 400)).foregroundStyle(OB.sub)
                                  }
                                  .frame(maxWidth: .infinity, alignment: .leading)
                                  OBCheck(on: on)""")

          edit(O + "OnboardingFinal.swift",
          """            ("🎯", "Goal", m.goalInfo.label),""",
          """            ("🎯", m.selectedGoals.count > 1 ? "Goals" : "Goal", m.goalLabels),""")

          # --- Profile ---
          P = "Views/Profile/ProfileView.swift"
          edit(P,
          """row("target", String(localized: "My Goal"), profile.goal.title)""",
          """row("target", profile.allGoals.count > 1 ? String(localized: "My Goals") : String(localized: "My Goal"), profile.allGoals.map(\\.title).joined(separator: ", "))""")
          edit(P,
          """OnboardingPrefEditor(screen: .goal, title: "What’s your main goal?", subtitle: "This shapes everything I recommend.", mood: .idea,""",
          """OnboardingPrefEditor(screen: .goal, title: "What are your goals?", subtitle: "Pick all that apply. This shapes everything I recommend.", mood: .idea,""")
          edit(P,
          """                                 p.goal = new.goal
          """,
          """                                 p.goal = new.goal
                                           p.goals = new.goals
          """)
          edit(P,
          """        goal = goals[p.goal] ?? "save_money"
          """,
          """        goal = goals[p.goal] ?? "save_money"
                  self.goals = p.allGoals.compactMap { goals[$0] }
          """)

          def main(root="."):
              import os
              files = {}
              for path, old, new, count in EDITS:
                  p = os.path.join(root, path)
                  s = files.get(p) or open(p, encoding="utf-8").read()
                  n = s.count(old)
                  if n != count:
                      sys.exit(f"Anchor found {n}x (expected {count}) in {path}:\n{old[:120]}")
                  files[p] = s.replace(old, new)
              for p, s in files.items():
                  open(p, "w", encoding="utf-8").write(s)
                  print("edited", p)

          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-goals.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pick several goals (onboarding and Profile); cuisines default to I love it all"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
