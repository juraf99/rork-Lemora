name: Paywall 2.0 and subscription settings

# One-shot: paywall = "Lemora Paywall 2.0" (3-day trial), trial reminder day 2, Profile subscription management.
# Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-paywall2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          cat > /tmp/edits.py <<'PYEOF'
          """Paywall = "Lemora Paywall 2.0" (3-day free trial copy, no big gap), trial reminder on day 2,
          and Profile > Subscription: current plan, switch monthly -> yearly, manage/cancel, restore."""
          import sys

          R = "ios-bitewise/Lemora/"
          EDITS = []

          def edit(path, old, new, count=1):
              EDITS.append((R + path, old, new, count))

          F = "Views/Onboarding/OnboardingFinal.swift"

          edit(F,
          """    private var timeline: [(String, String, String)] {
                  if annual, let days = trialDays {
                      return [("🔓", "Today", "Everything unlocked: unlimited swipes, every deal"),
                              ("🔔", "Day \\(max(1, days - 2))", "We’ll remind you before the trial ends"),
                              ("⭐", "Day \\(days)", "\\(annualPrice)/year starts. Cancel anytime before.")]
                  }
                  if annual {
                      return [("🔓", "Today", "Everything unlocked · \\(annualPrice) billed"),
                              ("🔔", "Every year", "Renews at \\(annualPrice)"),
                              ("⭐", "Anytime", "Cancel in Settings in two taps")]
                  }
                  return [("🔓", "Today", "Everything unlocked · \\(monthlyPrice) billed"),
                          ("🔔", "Every month", "Renews at \\(monthlyPrice)"),
                          ("⭐", "Anytime", "Cancel in Settings in two taps")]
              }

              private var cta: String {
                  if annual { return trialDays == 7 ? "START MY FREE WEEK" : (trialDays.map { "START MY \\($0)-DAY FREE TRIAL" } ?? "Continue · \\(annualPrice)/yr") }
                  return "Continue · \\(monthlyPrice)/mo"
              }

              private var legal: String {
                  if annual, let days = trialDays { return "Free for \\(days) days, then \\(annualPrice) \\(currencyCode)/year. Cancel anytime." }
                  return annual ? "\\(annualPrice) \\(currencyCode)/year. Renews until cancelled." : "\\(monthlyPrice) \\(currencyCode)/month. Renews until cancelled."
              }""",
          """    /// Copy from "Lemora Paywall 2.0". Prices are the App Store prices in the buyer's own currency.
              private var timeline: [(String, String, String)] {
                  if annual, let days = trialDays {
                      return [("🔓", "Today", "Everything unlocked: unlimited swipes, every deal"),
                              ("🔔", "Day \\(TrialReminderService.reminderDay(forTrialDays: days))", "We’ll remind you before your free trial ends"),
                              ("⭐", "Day \\(days)", "\\(annualPrice)/year starts. Cancel anytime before.")]
                  }
                  if annual {
                      // This Apple ID already used its free trial: no "free" promise, same three steps.
                      return [("🔓", "Today", "Everything unlocked: unlimited swipes, every deal"),
                              ("🔔", "Every year", "\\(annualPrice)/year, renews until you cancel"),
                              ("⭐", "Anytime", "Cancel in Settings. You keep access until the end of your year.")]
                  }
                  return [("🔓", "Today", "Everything unlocked · \\(monthlyPrice) billed"),
                          ("🔁", "Every month", "Renews at \\(monthlyPrice)"),
                          ("✨", "Anytime", "Cancel in Settings in two taps")]
              }

              private var cta: String {
                  if annual { return trialDays.map { "START MY \\($0)-DAY FREE TRIAL" } ?? "Continue · \\(annualPrice)/yr" }
                  return "Continue · \\(monthlyPrice)/mo"
              }

              private var legal: String {
                  if annual, let days = trialDays {
                      return "\\(days) days free, then \\(annualPrice)/year (\\(currencyCode)). We’ll remind you before your free trial ends."
                  }
                  return annual ? "\\(annualPrice) \\(currencyCode)/year. Renews until cancelled." : "\\(monthlyPrice) \\(currencyCode)/month. Renews until cancelled."
              }

              private var paywallSub: String {
                  let n = m.a.stores.count
                  return n > 0 ? "Tailored to your goal, your diet and \\(n) store\\(n != 1 ? "s" : "") near you."
                               : "Tailored to your goal, your diet and the stores near you."
              }""")

          edit(F,
          """                OBText("Tailored to your goal, your diet and \\(m.a.stores.count) store\\(m.a.stores.count != 1 ? "s" : "") near you.", 13.5, 400, color: OB.muted)""",
          """                OBText(paywallSub, 13.5, 400, color: OB.muted)""")

          # No big empty gap between the timeline and the plan cards: the gap is capped, taller phones give the room to the hero.
          edit(F,
          """                Spacer(minLength: 12)

                          OBWeightedRow(weights: [1.25, 1], spacing: 10) {""",
          """                Spacer(minLength: 12)
                              .frame(maxHeight: 32)

                          OBWeightedRow(weights: [1.25, 1], spacing: 10) {""")

          edit(F,
          """            let w = geo.size.width
                      ZStack(alignment: .top) {
                          OBRays(opacity: 0.42, inner: 0.18, outer: 0.62, duration: 30, filled: true, diameter: 460)
                              .position(x: w / 2, y: 86)
                          OBTwinkle(color: OB.lemon, size: 10, delay: 0).position(x: 83, y: 47)
                          OBTwinkle(color: OB.leaf, size: 8, delay: 0.6).position(x: w - 88, y: 28)
                          OBTwinkle(color: OB.orange, size: 7, delay: 1.2).position(x: w - 67, y: 139)
                          ZestyMascot(mood: .happy, size: 132, seedKey: "pw")
                              .padding(.top, 19)
                              .obPop(duration: 0.6)
                      }
                      .frame(width: w, height: geo.size.height)
                  }
                  .frame(height: 190)""",
          """            let w = geo.size.width
                      let c = geo.size.height / 2 - 9
                      ZStack(alignment: .top) {
                          OBRays(opacity: 0.42, inner: 0.18, outer: 0.62, duration: 30, filled: true, diameter: 460)
                              .position(x: w / 2, y: c)
                          OBTwinkle(color: OB.lemon, size: 10, delay: 0).position(x: 83, y: c - 39)
                          OBTwinkle(color: OB.leaf, size: 8, delay: 0.6).position(x: w - 88, y: c - 58)
                          OBTwinkle(color: OB.orange, size: 7, delay: 1.2).position(x: w - 67, y: c + 53)
                          ZestyMascot(mood: .happy, size: 132, seedKey: "pw")
                              .padding(.top, max(0, c - 67))
                              .obPop(duration: 0.6)
                      }
                      .frame(width: w, height: geo.size.height)
                  }
                  .frame(minHeight: 190, maxHeight: 270)""")

          # Trial reminder: day 2 of a 3-day trial (day 5 of a 7-day one).
          edit("Services/TrialReminderService.swift",
          """    static func reminderDay(forTrialDays days: Int) -> Int {
                  max(1, days - 2)
              }""",
          """    static func reminderDay(forTrialDays days: Int) -> Int {
                  max(1, days - (days > 3 ? 2 : 1))
              }""")

          edit("Services/TrialReminderService.swift",
          """        content.body = String(localized: "Your trial ends in \\(remaining) days. After that, \\(priceText)/year starts unless you cancel in Settings.")""",
          """        content.body = remaining == 1
                      ? String(localized: "Your free trial ends tomorrow. After that, \\(priceText)/year starts unless you cancel in Settings.")
                      : String(localized: "Your free trial ends in \\(remaining) days. After that, \\(priceText)/year starts unless you cancel in Settings.")""")

          # Subscription details for the Profile.
          S = "Services/SubscriptionService.swift"
          edit(S,
          """    private(set) var isEligibleForTrial = false
          """,
          """    private(set) var isEligibleForTrial = false
              /// Current plan (from RevenueCat): product id, end of the paid period or trial, auto-renew, trial.
              private(set) var activeProductId: String?
              private(set) var expirationDate: Date?
              private(set) var willRenew = true
              private(set) var isInTrial = false
          """)

          edit(S,
          """    private func apply(_ info: CustomerInfo) {
                  hasActiveSubscription = info.entitlements[Self.entitlementId]?.isActive == true
                      || !info.activeSubscriptions.isDisjoint(with: [Self.annualId, Self.monthlyId])
                  hasCheckedEntitlements = true
              }""",
          """    private func apply(_ info: CustomerInfo) {
                  let ent = info.entitlements[Self.entitlementId]
                  hasActiveSubscription = ent?.isActive == true
                      || !info.activeSubscriptions.isDisjoint(with: [Self.annualId, Self.monthlyId])
                  if let ent, ent.isActive {
                      activeProductId = ent.productIdentifier
                      expirationDate = ent.expirationDate
                      willRenew = ent.willRenew
                      isInTrial = ent.periodType == .trial
                  } else {
                      activeProductId = info.activeSubscriptions.first { [Self.annualId, Self.monthlyId].contains($0) }
                      expirationDate = activeProductId.flatMap { info.expirationDate(forProductIdentifier: $0) }
                      willRenew = true
                      isInTrial = false
                  }
                  hasCheckedEntitlements = true
              }

              /// Apple's own subscription sheet: cancel (access stays until the end of the period) or change plan.
              func showManageSubscriptions() async {
                  do {
                      try await Purchases.shared.showManageSubscriptions()
                  } catch {
                      if let url = URL(string: "https://apps.apple.com/account/subscriptions") { await UIApplication.shared.open(url) }
                  }
                  await refreshEntitlements()
              }""")

          edit(S,
          """import OSLog
          """,
          """import OSLog
          import UIKit
          """)

          P = "Views/Profile/ProfileView.swift"
          edit(P,
          """                Section("Subscription") {
                              Label("Your Lemora plan is active", systemImage: "checkmark.seal.fill").foregroundStyle(BW.leafDeep)
                              Button("Restore purchases") { Task { await store.subscription.restore() } }
                          }""",
          """                Section("Subscription") {
                              SubscriptionSummary()
                          }""")

          edit(P,
          """// MARK: - Editors (reuse onboarding steps so everything stays editable)
          """,
          """// MARK: - Subscription

          /// Current plan, renewal or trial date, monthly -> yearly switch, Apple's manage/cancel sheet and restore.
          struct SubscriptionSummary: View {
              @Environment(AppStore.self) private var store
              @State private var switching = false
              @State private var message: String?

              private var sub: SubscriptionService { store.subscription }
              private var isYearly: Bool { sub.activeProductId == SubscriptionService.annualId }
              private var isMonthly: Bool { sub.activeProductId == SubscriptionService.monthlyId }
              private var date: String { sub.expirationDate?.formatted(date: .long, time: .omitted) ?? "" }

              private var planName: String {
                  if isYearly { return sub.isInTrial ? String(localized: "Lemora Yearly · free trial") : String(localized: "Lemora Yearly") }
                  if isMonthly { return String(localized: "Lemora Monthly") }
                  return String(localized: "Your Lemora plan is active")
              }

              private var status: String? {
                  guard sub.expirationDate != nil else { return nil }
                  if sub.isInTrial {
                      return sub.willRenew
                          ? String(localized: "Free trial ends \\(date). Cancel before then and you won’t be charged.")
                          : String(localized: "Free trial cancelled. You keep access until \\(date).")
                  }
                  if !sub.willRenew { return String(localized: "Cancelled. You keep access until \\(date).") }
                  return isYearly
                      ? String(localized: "Renews \\(date). If you cancel, you keep access until then and the next year isn’t charged.")
                      : String(localized: "Renews \\(date). Cancel anytime; you keep access until then.")
              }

              var body: some View {
                  Group {
                      VStack(alignment: .leading, spacing: 4) {
                          Label(planName, systemImage: "checkmark.seal.fill").foregroundStyle(BW.leafDeep)
                          if let status {
                              Text(status).font(.bw(.subheadline, weight: .regular)).foregroundStyle(BW.inkSecondary)
                          }
                      }
                      .task { await sub.refreshEntitlements() }
                      if isMonthly, let annual = sub.annual {
                          Button {
                              Task { await switchToYearly(annual) }
                          } label: {
                              HStack {
                                  Text("Switch to yearly · \\(annual.displayPrice)/year")
                                  Spacer()
                                  if switching { ProgressView() }
                              }
                          }
                          .disabled(switching)
                      }
                      Button("Manage or cancel subscription") { Task { await sub.showManageSubscriptions() } }
                      Button("Restore purchases") { Task { await sub.restore() } }
                      if let message {
                          Text(message).font(.bw(.subheadline, weight: .regular)).foregroundStyle(BW.inkSecondary)
                      }
                  }
              }

              private func switchToYearly(_ annual: Product) async {
                  switching = true
                  defer { switching = false }
                  do {
                      if try await sub.purchase(annual) {
                          message = String(localized: "You’re on the yearly plan.")
                      }
                  } catch {
                      message = String(localized: "The change didn’t go through. Please try again.")
                  }
              }
          }

          // MARK: - Editors (reuse onboarding steps so everything stays editable)
          """)

          edit(P,
          """import SwiftUI
          """,
          """import SwiftUI
          import StoreKit
          """)

          def main(root="."):
              import os
              files = {}
              for path, old, new, count in EDITS:
                  p = os.path.join(root, path)
                  s = files.get(p) or open(p, encoding="utf-8").read()
                  n = s.count(old)
                  if n != count:
                      sys.exit(f"Anchor found {n}x (expected {count}) in {path}:\n{old[:120]}")
                  files[p] = s.replace(old, new)
              for p, s in files.items():
                  open(p, "w", encoding="utf-8").write(s)
                  print("edited", p)

          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-paywall2.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Paywall 2.0 (3-day trial copy, no gap), day-2 trial reminder, subscription management in Profile"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
