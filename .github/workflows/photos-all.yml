      - name: Bundle the ingredient photos
        run: |
          set -e
          out=ios-bitewise/Lemora/Resources/FoodPhotos
          mkdir -p "$out"
          base=https://fsucqlqsafoligouzgrl.supabase.co/storage/v1/object/public/food-photos
          fail=0
          keys="
            almond anchovy apple apricot arborio artichoke arugula bacon baking_powder balsamic banana barley
            basil basil_pesto bean_sprout beef beef_broth beef_ground beet_hummus bell_pepper beluga_lentil
            black_bean black_pepper black_rice blueberries bok_choy bread breadcrumb brioche_bun broth
            brown_rice brown_sugar bucatini buckwheat buckwheat_flour bulgur bun burrata butter butter_bean
            butternut canola_oil caper caraway cardamom casarecce cashew cheddar cherry_tomato chia
            chicken_thigh chickpea chili chili_powder chipotle chives cilantro cinnamon clams clove cocoa
            coconut coconut_milk conchiglioni coriander_seed corn_tortilla cottage couscous cranberry cream
            cream_cheese crushed_tomato cucumber_mini cumin cumin_seed curry curry_powder dark_chocolate dill
            ditalini dried_chili dried_ginger duck edamame egg falafel farfalle farro fennel fennel_seed feta
            fish_sauce flank_steak flour freekeh fresh_roll fusilli garam_masala garlic ginger glass_noodles
            gnocchi goat_cheese gochujang granola greek_yogurt green_bean green_pepper greens gruyere guanciale
            haddock halloumi ham honey hot_sauce hummus kidney_bean lamb lasagna lemon lemongrass lentil lime
            linguine mango maple_syrup mascarpone mayonnaise melon_honeydew milk millet mint miso mozzarella
            mussel mustard naan napa nori nutmeg oat oat_cream okra olive olive_oil orange_juice orecchiette
            oregano orzo paneer pappardelle paprika parmesan parsley pea peanut peanut_butter pecan pecorino
            penne pepper_mini phyllo pickle pie_crust pine_nut pineapple pinto_bean pistachio pita polenta
            pomegranate pork_belly portobello protein_powder provolone prune pumpkin pumpkin_seed quinoa ramen
            rapini raspberry red_cabbage red_lentil red_pepper rice rice_noodle rice_vermicelli rice_vinegar
            ricotta rigatoni rosemary saffron sage salsa salsa_verde salt sardine sea_bass sesame_oil
            sesame_seed shiitake shrimp smoked_salmon soba sour_cream soy_sauce spaghetti sprouts squid
            star_anise sugar sun_dried_tomato sunflower_seed sushi_rice sweet_potato sweet_potato_noodles
            tagliatelle tahini tamarind tempeh teriyaki_sauce thai_basil thyme tofu tomato_paste tomato_sauce
            tortilla tuna tuna_steak turkey turmeric tzatziki udon vanilla vienna_sausage vinegar vodka walnut
            water white_bean white_wine whole_tortilla whole_wheat_pasta wild_rice yellow_pepper yogurt zucchini"
          for k in $keys
          do
            curl -sSf --retry 3 -o "$out/food-$k.webp" "$base/food-$k.webp" || { echo "missing $k"; fail=$((fail+1)); }
          done
          echo "failed: $fail"
          test "$fail" -le 3
          git rm -f .github/workflows/photos-all.yml
          git add -A
          git status --short | tail -5
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "A photo for every ingredient, simpler store prices, streak week shows the current streak only"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
