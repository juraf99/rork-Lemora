name: Fix where you shop build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shop.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename duplicate variable
        run: |
          set -e
          f=ios-bitewise/Lemora/Views/Profile/ProfileView.swift
          python3 - "$f" <<'PY'
          import sys, re
          p = sys.argv[1]; s = open(p).read()
          a = s.index("let names = Dictionary(OnboardingModel.storeIds")
          b = s.index("stores = picked.sorted()", a) + len("stores = picked.sorted()")
          s = s[:a] + re.sub(r"\bpicked\b", "pickedStores", s[a:b]) + s[b:]
          open(p, "w").write(s)
          PY
          grep -n "pickedStores" "$f"
          git rm -f .github/workflows/fix-shop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Fix duplicate variable in Where you shop editor"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
