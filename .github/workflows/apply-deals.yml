name: Deals, Discover and recipe savings redesign

# One-shot: new Deals page, Discover card with big price per serving, recipe page with big savings. Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-deals.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          cat > /tmp/edits.py <<'PYEOF'
          """Recipe detail: big savings card, store + sale price per ingredient, Cook this tonight.
          Deals page redesign (store cards, "See all foods on sale" banner, richer Worth It cards)
          and Discover card with a big price per serving, savings and the deal on top."""
          import sys, os

          R = "ios-bitewise/Lemora/"
          BETWEEN = []

          def between(path, start, end, new):
              BETWEEN.append((R + path, start, end, new))

          between("Views/Deals/DealsView.swift", "struct DealsView: View {", "struct StealCard: View {", r'''struct DealsView: View {
              @Environment(AppStore.self) private var store
              @State private var path: NavigationPath = NavigationPath()
              @State private var myStoresOnly: Bool = true

              var body: some View {
                  NavigationStack(path: $path) {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 24) {
                              header
                              storeToggle
                              storesThisWeek
                              seeAllBanner
                              worthIt
                              SamplePricesNote().padding(.horizontal, 20)
                          }
                          .padding(.bottom, 24)
                      }
                      .background(BW.canvas)
                      .toolbar(.hidden, for: .navigationBar)
                      .bitewiseDestinations()
                      .onAppear {
                          store.track("deals_opened")
                          ensureVisibleDeals()
                      }
                      .onChange(of: store.deals) { _, _ in ensureVisibleDeals() }
                  }
              }

              // MARK: Header

              private var storeCount: Int { Set(stealItems.map(\.retailerId)).count }

              private var headerSubtitle: String {
                  if myStoresOnly && storeCount > 0 {
                      return storeCount == 1 ? String(localized: "From this week’s sales at your store")
                                             : String(localized: "From this week’s sales at your \(storeCount) stores")
                  }
                  return String(localized: "From this week’s sales near you")
              }

              private var header: some View {
                  HStack(alignment: .center) {
                      VStack(alignment: .leading, spacing: 3) {
                          Text("Fresh deals for you")
                              .font(.bw(.title, weight: .heavy))
                              .foregroundStyle(BW.ink)
                          Text(headerSubtitle).font(.bw(.subheadline, weight: .regular)).foregroundStyle(BW.inkSecondary)
                      }
                      Spacer()
                      MascotView(name: BWImage.mascotWave, size: 76, bob: true)
                  }
                  .padding(.horizontal, 20)
                  .padding(.top, 4)
              }

              private var storeToggle: some View {
                  HStack(spacing: 4) {
                      toggleButton(String(localized: "My Stores"), selected: myStoresOnly) { myStoresOnly = true }
                      toggleButton(String(localized: "All Stores"), selected: !myStoresOnly) {
                          myStoresOnly = false
                          store.track("all_stores_enabled")
                      }
                  }
                  .padding(4)
                  .background(BW.beige, in: .capsule)
                  .padding(.horizontal, 20)
                  .sensoryFeedback(.selection, trigger: myStoresOnly)
              }

              private func toggleButton(_ title: String, selected: Bool, action: @escaping () -> Void) -> some View {
                  Button {
                      withAnimation(.snappy) { action() }
                  } label: {
                      Text(title)
                          .font(.bw(.subheadline, weight: .bold))
                          .foregroundStyle(BW.ink)
                          .frame(maxWidth: .infinity, minHeight: 44)
                          .background(selected ? BW.lemon : .clear, in: .capsule)
                  }
                  .accessibilityAddTraits(selected ? .isSelected : [])
              }

              // MARK: Stores this week

              private var stealItems: [Deal] { store.steals(myStoresOnly: myStoresOnly) }

              /// A stale or unsupported store selection must not make the whole page look empty.
              /// Switch the visible scope to All Stores while keeping the user's preferences intact.
              private func ensureVisibleDeals() {
                  guard myStoresOnly,
                        store.steals(myStoresOnly: true).isEmpty,
                        !store.steals(myStoresOnly: false).isEmpty else { return }
                  myStoresOnly = false
              }

              private var storeGroups: [StoreDeals] {
                  let grouped = Dictionary(grouping: stealItems, by: \.retailerId)
                  return grouped.map { entry in
                      StoreDeals(id: entry.key,
                                 name: entry.value.first?.retailerDisplayName ?? RetailerCatalog.name(entry.key),
                                 deals: entry.value.sorted { a, b in (a.discountPercent ?? 0) > (b.discountPercent ?? 0) })
                  }
                  .sorted { a, b in a.deals.count > b.deals.count }
              }

              private var storesThisWeek: some View {
                  VStack(alignment: .leading, spacing: 4) {
                      SectionHeader(title: myStoresOnly ? String(localized: "Your stores this week") : String(localized: "Stores near you this week")) {
                          path.append(Route.stealsAll)
                      }
                      .padding(.horizontal, 20)

                      if storeGroups.isEmpty {
                          Text("No active deals at your stores right now. Try All Stores.")
                              .font(.bw(.subheadline, weight: .regular)).foregroundStyle(BW.inkSecondary)
                              .padding(.horizontal, 20)
                              .padding(.top, 8)
                      } else {
                          ScrollView(.horizontal) {
                              LazyHStack(alignment: .top, spacing: 14) {
                                  ForEach(storeGroups) { group in
                                      StoreDealsCard(group: group)
                                  }
                              }
                              .scrollTargetLayout()
                          }
                          .contentMargins(.horizontal, 20)
                          .scrollTargetBehavior(.viewAligned)
                          .scrollIndicators(.hidden)
                      }
                  }
              }

              private var seeAllBanner: some View {
                  Button { path.append(Route.stealsAll) } label: {
                      HStack(spacing: 14) {
                          Image(systemName: "tag.fill")
                              .font(.system(size: 20, weight: .bold))
                              .foregroundStyle(BW.ink)
                              .frame(width: 50, height: 50)
                              .background(BW.lemon, in: .circle)
                          VStack(alignment: .leading, spacing: 3) {
                              Text("See all foods on sale this week")
                                  .font(.bw(.headline)).foregroundStyle(.white)
                                  .lineLimit(1).minimumScaleFactor(0.8)
                              Text(myStoresOnly ? String(localized: "\(stealItems.count) deals at your stores")
                                                : String(localized: "\(stealItems.count) deals near you"))
                                  .font(.bw(.subheadline, weight: .medium)).foregroundStyle(.white.opacity(0.75))
                          }
                          Spacer(minLength: 8)
                          Image(systemName: "chevron.right").font(.headline.weight(.heavy)).foregroundStyle(BW.lemon)
                      }
                      .padding(16)
                      .background(BW.ink, in: .rect(cornerRadius: BW.cardRadius))
                  }
                  .buttonStyle(BWPressableStyle())
                  .padding(.horizontal, 20)
              }

              // MARK: Worth It

              private var worthItItems: [ScoredRecipe] { store.worthIt }

              private var worthIt: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      SectionHeader(title: String(localized: "Worth It This Week"), subtitle: String(localized: "Meals you'll love, built from these deals")) {
                          path.append(Route.worthItAll)
                      }
                      .padding(.horizontal, 20)

                      if worthItItems.isEmpty {
                          Text("No deal-powered meals match your profile this week yet.")
                              .font(.bw(.subheadline, weight: .regular)).foregroundStyle(BW.inkSecondary)
                              .padding(.horizontal, 20)
                      } else {
                          VStack(spacing: 16) {
                              ForEach(Array(worthItItems.prefix(3))) { item in
                                  NavigationLink(value: Route.recipe(item.id)) {
                                      WorthItCard(item: item)
                                  }
                                  .buttonStyle(BWPressableStyle())
                              }
                          }
                          .padding(.horizontal, 20)
                      }
                  }
              }
          }

          // MARK: - Store styling

          /// Store colors for chips and store cards. Unknown stores use the app's lemon palette.
          enum StoreStyle {
              static func colors(_ id: String) -> (bg: Color, fg: Color) {
                  switch id {
                  case "maxi": return (Color(hex: 0xFCE44D), Color(hex: 0x1D4F91))
                  case "iga": return (Color(hex: 0xD7323A), .white)
                  case "metro": return (Color(hex: 0xC8102E), .white)
                  case "superc": return (Color(hex: 0xFFCB05), Color(hex: 0xC8102E))
                  case "provigo": return (Color(hex: 0xEE7623), .white)
                  case "walmart": return (Color(hex: 0x0071CE), Color(hex: 0xFFC220))
                  case "costco": return (Color(hex: 0x005DAA), .white)
                  case "adonis": return (Color(hex: 0x1E5B3A), .white)
                  default: return (BW.lemonSoft, BW.ink)
                  }
              }
          }

          struct StoreChip: View {
              let retailerId: String
              let name: String

              var body: some View {
                  let c = StoreStyle.colors(retailerId)
                  Text(name)
                      .font(.bw(.caption, weight: .heavy))
                      .foregroundStyle(c.fg)
                      .lineLimit(1)
                      .padding(.horizontal, 9)
                      .padding(.vertical, 4)
                      .background(c.bg, in: .capsule)
              }
          }

          enum DealTiming {
              /// "Deal ends Sunday" this week, otherwise "Deal ends Oct 12".
              static func endText(_ date: Date, plural: Bool = false) -> String {
                  let days = Calendar.current.dateComponents([.day], from: .now, to: date).day ?? 0
                  if days < 1 {
                      return plural ? String(localized: "Deals end today") : String(localized: "Deal ends today")
                  }
                  let when = days < 7 ? date.formatted(.dateTime.weekday(.wide)) : date.formatted(.dateTime.month(.abbreviated).day())
                  return plural ? String(localized: "Deals end \(when)") : String(localized: "Deal ends \(when)")
              }
          }

          struct StoreDeals: Identifiable {
              let id: String
              let name: String
              let deals: [Deal]
          }

          /// One store's best deals this week, and meals you can make with them.
          struct StoreDealsCard: View {
              @Environment(AppStore.self) private var store
              let group: StoreDeals

              private var top: [Deal] { Array(group.deals.prefix(3)) }

              private var meals: [ScoredRecipe] {
                  var seen = Set<ScoredRecipe.ID>()
                  var out: [ScoredRecipe] = []
                  for deal in top {
                      for item in store.recipesUsing(ingredientId: deal.ingredientId) where !seen.contains(item.id) {
                          seen.insert(item.id)
                          out.append(item)
                      }
                  }
                  return Array(out.sorted { a, b in a.price.savings > b.price.savings }.prefix(3))
              }

              var body: some View {
                  let c = StoreStyle.colors(group.id)
                  VStack(alignment: .leading, spacing: 0) {
                      HStack(alignment: .top) {
                          VStack(alignment: .leading, spacing: 6) {
                              Text(group.name)
                                  .font(.bw(size: 30, weight: .heavy))
                                  .foregroundStyle(c.fg)
                                  .lineLimit(1)
                                  .minimumScaleFactor(0.6)
                              if let end = group.deals.map(\.validUntil).min() {
                                  Label(DealTiming.endText(end, plural: true), systemImage: "timer")
                                      .font(.bw(.subheadline, weight: .bold))
                                      .foregroundStyle(c.fg.opacity(0.85))
                              }
                          }
                          Spacer(minLength: 8)
                          Text(group.deals.count == 1 ? String(localized: "1 deal") : String(localized: "\(group.deals.count) deals"))
                              .font(.bw(.caption, weight: .heavy))
                              .foregroundStyle(BW.ink)
                              .padding(.horizontal, 12)
                              .padding(.vertical, 7)
                              .background(.white.opacity(0.92), in: .capsule)
                      }
                      .padding(18)
                      .frame(maxWidth: .infinity, alignment: .leading)
                      .background(c.bg)

                      VStack(spacing: 0) {
                          ForEach(Array(top.enumerated()), id: \.element.id) { i, deal in
                              NavigationLink(value: Route.deal(deal.id)) { dealRow(deal) }
                                  .buttonStyle(BWPressableStyle())
                              if i < top.count - 1 {
                                  Rectangle().fill(BW.hairline).frame(height: 1)
                              }
                          }
                      }
                      .padding(.horizontal, 16)

                      if meals.isEmpty {
                          Color.clear.frame(height: 8)
                      } else {
                          VStack(alignment: .leading, spacing: 10) {
                              Text("With these, you can make")
                                  .font(.bw(.subheadline, weight: .bold))
                                  .foregroundStyle(BW.ink)
                              HStack(alignment: .top, spacing: 8) {
                                  ForEach(meals) { item in
                                      NavigationLink(value: Route.recipe(item.id)) { mealTile(item) }
                                          .buttonStyle(BWPressableStyle())
                                  }
                              }
                          }
                          .padding(16)
                      }
                  }
                  .frame(width: 300)
                  .background(BW.card)
                  .clipShape(.rect(cornerRadius: BW.cardRadius))
                  .shadow(color: BW.ink.opacity(0.07), radius: 14, y: 6)
                  .padding(.vertical, 8)
              }

              private func dealRow(_ deal: Deal) -> some View {
                  HStack(spacing: 12) {
                      DealArtwork(deal: deal, height: 56, radius: 14)
                          .frame(width: 56)
                      VStack(alignment: .leading, spacing: 2) {
                          Text(IngredientCatalog.name(deal.ingredientId))
                              .font(.bw(.subheadline, weight: .bold))
                              .foregroundStyle(BW.ink)
                              .lineLimit(1)
                          if let regular = deal.regularPrice {
                              Text(Money.format(regular))
                                  .font(.bw(.caption, weight: .medium))
                                  .strikethrough()
                                  .foregroundStyle(BW.inkSecondary)
                          }
                      }
                      Spacer(minLength: 6)
                      VStack(alignment: .trailing, spacing: 4) {
                          Text(deal.priceText)
                              .font(.bw(.headline, weight: .heavy))
                              .monospacedDigit()
                              .foregroundStyle(BW.ink)
                              .lineLimit(1)
                              .minimumScaleFactor(0.7)
                          if let pct = deal.discountPercent {
                              Text("-\(pct)%")
                                  .font(.bw(.caption, weight: .heavy))
                                  .foregroundStyle(.white)
                                  .padding(.horizontal, 8)
                                  .padding(.vertical, 3)
                                  .background(BW.leafDeep, in: .capsule)
                          }
                      }
                  }
                  .padding(.vertical, 12)
                  .contentShape(.rect)
              }

              private func mealTile(_ item: ScoredRecipe) -> some View {
                  VStack(alignment: .leading, spacing: 0) {
                      FoodImage(name: item.recipe.imageName, height: 64, radius: 0)
                      VStack(alignment: .leading, spacing: 2) {
                          Text(item.recipe.title)
                              .font(.bw(.caption, weight: .bold))
                              .foregroundStyle(BW.ink)
                              .lineLimit(2)
                              .multilineTextAlignment(.leading)
                          if item.price.savings > 0.01 {
                              Text("Save \(Money.format(item.price.savings))")
                                  .font(.bw(.caption, weight: .heavy))
                                  .foregroundStyle(BW.leafDeep)
                          }
                      }
                      .padding(8)
                      .frame(maxWidth: .infinity, alignment: .leading)
                  }
                  .frame(maxWidth: .infinity)
                  .background(BW.beigeSoft)
                  .clipShape(.rect(cornerRadius: 14))
              }
          }

          /// Worth It card: savings and stores on the photo, then every deal ingredient with its store and price.
          struct WorthItCard: View {
              let item: ScoredRecipe

              private struct StoreRef: Hashable { let id: String; let name: String }

              private var lines: [PriceLine] {
                  Array(item.price.dealLines.sorted { a, b in a.savings > b.savings }.prefix(3))
              }

              private var stores: [StoreRef] {
                  var seen = Set<String>()
                  var out: [StoreRef] = []
                  for line in item.price.dealLines {
                      if let deal = line.deal, !seen.contains(deal.retailerId) {
                          seen.insert(deal.retailerId)
                          out.append(StoreRef(id: deal.retailerId, name: deal.retailerDisplayName))
                      }
                  }
                  return out
              }

              private var endDate: Date? { item.price.dealLines.compactMap { $0.deal?.validUntil }.min() }

              var body: some View {
                  VStack(alignment: .leading, spacing: 0) {
                      FoodImage(name: item.recipe.imageName, height: 190, radius: 0)
                          .overlay(alignment: .topLeading) {
                              if item.price.savings > 0.01 {
                                  Text("Save \(Money.format(item.price.savings)) total")
                                      .font(.bw(.subheadline, weight: .heavy))
                                      .foregroundStyle(.white)
                                      .padding(.horizontal, 12)
                                      .padding(.vertical, 7)
                                      .background(BW.leafDeep, in: .capsule)
                                      .padding(12)
                              }
                          }
                          .overlay(alignment: .topTrailing) {
                              HStack(spacing: 4) {
                                  ForEach(Array(stores.prefix(3)), id: \.self) { s in
                                      StoreChip(retailerId: s.id, name: s.name)
                                  }
                              }
                              .padding(12)
                          }

                      VStack(alignment: .leading, spacing: 10) {
                          Text(item.recipe.title)
                              .font(.bw(.title3, weight: .heavy))
                              .foregroundStyle(BW.ink)
                              .lineLimit(2)
                              .multilineTextAlignment(.leading)
                          HStack(spacing: 8) {
                              MatchBadge(percent: item.matchPercent, compact: true)
                              Text("based on your preferences + your deals")
                                  .font(.bw(.caption, weight: .medium))
                                  .foregroundStyle(BW.inkSecondary)
                                  .lineLimit(1)
                                  .minimumScaleFactor(0.8)
                          }
                          if !lines.isEmpty {
                              VStack(spacing: 6) {
                                  ForEach(lines) { line in
                                      HStack(spacing: 8) {
                                          if let deal = line.deal {
                                              StoreChip(retailerId: deal.retailerId, name: deal.retailerDisplayName)
                                          }
                                          Text(IngredientCatalog.name(line.ingredientId))
                                              .font(.bw(.subheadline, weight: .bold))
                                              .foregroundStyle(BW.ink)
                                              .lineLimit(1)
                                          Spacer(minLength: 6)
                                          Text(Money.format(line.regularCost))
                                              .font(.bw(.caption, weight: .medium))
                                              .strikethrough()
                                              .foregroundStyle(BW.inkSecondary)
                                          Text(Money.format(line.cost))
                                              .font(.bw(.subheadline, weight: .heavy))
                                              .monospacedDigit()
                                              .foregroundStyle(BW.leafDeep)
                                      }
                                      .padding(.horizontal, 12)
                                      .padding(.vertical, 9)
                                      .background(BW.leafSoft.opacity(0.6), in: .rect(cornerRadius: 12))
                                  }
                              }
                          }
                          HStack {
                              Text("\(Money.format(item.price.perServing))/serving · \(item.recipe.totalMinutes) min")
                                  .font(.bw(.subheadline, weight: .medium))
                                  .monospacedDigit()
                                  .foregroundStyle(BW.inkSecondary)
                              Spacer(minLength: 8)
                              if let endDate {
                                  Label(DealTiming.endText(endDate), systemImage: "timer")
                                      .font(.bw(.caption, weight: .bold))
                                      .foregroundStyle(BW.amber)
                              }
                          }
                      }
                      .padding(16)
                  }
                  .background(BW.card)
                  .clipShape(.rect(cornerRadius: BW.cardRadius))
                  .shadow(color: BW.ink.opacity(0.07), radius: 14, y: 6)
              }
          }

          ''')
          between("Views/Discover/DiscoverView.swift",
                  "/// The hero swipe card: food first, stats overlaid, match + reason below the title.\nstruct RecipeSwipeCard: View {",
                  "struct WhyThisSheet: View {", r'''/// The hero swipe card: big price per serving, savings and the deal on top, match below the title.
          struct RecipeSwipeCard: View {
              let item: ScoredRecipe
              @Binding var showWhy: Bool

              private var headline: Deal? { item.price.headlineDeal?.deal }

              var body: some View {
                  GeometryReader { geo in
                      ZStack(alignment: .bottomLeading) {
                          FoodImage(name: item.recipe.imageName, height: geo.size.height, radius: BW.heroRadius)
                          LinearGradient(colors: [.black.opacity(0.15), .clear, .clear, .black.opacity(0.55), .black.opacity(0.85)],
                                         startPoint: .top, endPoint: .bottom)
                              .clipShape(.rect(cornerRadius: BW.heroRadius))
                              .allowsHitTesting(false)

                          VStack(alignment: .leading, spacing: 10) {
                              HStack(alignment: .firstTextBaseline, spacing: 6) {
                                  Text(Money.format(item.price.perServing))
                                      .font(.bw(size: 54, weight: .heavy))
                                      .monospacedDigit()
                                      .foregroundStyle(BW.lemon)
                                      .lineLimit(1)
                                      .minimumScaleFactor(0.7)
                                  Text("/ serving")
                                      .font(.bw(.headline, weight: .bold))
                                      .foregroundStyle(.white)
                              }

                              Text(item.recipe.title)
                                  .font(.bw(.title2, weight: .heavy))
                                  .foregroundStyle(.white)
                                  .lineLimit(2)
                                  .minimumScaleFactor(0.8)

                              HStack(spacing: 12) {
                                  stat("fork.knife", "\(item.recipe.nutrition.protein)g protein")
                                  divider
                                  stat("clock", "\(item.recipe.totalMinutes) min")
                              }
                              .lineLimit(1)
                              .minimumScaleFactor(0.75)

                              HStack(spacing: 10) {
                                  MatchBadge(percent: item.matchPercent)
                                  Button { showWhy = true } label: {
                                      Text(item.primaryReason?.text ?? String(localized: "based on your preferences + your deals"))
                                          .font(.bw(.subheadline, weight: .medium))
                                          .foregroundStyle(.white.opacity(0.92))
                                          .lineLimit(2)
                                          .multilineTextAlignment(.leading)
                                  }
                                  .accessibilityLabel(Text("Why this?"))
                              }
                          }
                          .padding(20)
                      }
                      .overlay(alignment: .topLeading) {
                          VStack(alignment: .leading, spacing: 8) {
                              if item.price.savings > 0.01 {
                                  Text("Save \(Money.format(item.price.savings)) total")
                                      .font(.bw(.subheadline, weight: .heavy))
                                      .foregroundStyle(.white)
                                      .padding(.horizontal, 12)
                                      .padding(.vertical, 7)
                                      .background(BW.leafDeep, in: .capsule)
                              }
                              if let deal = headline {
                                  HStack(spacing: 6) {
                                      StoreChip(retailerId: deal.retailerId, name: deal.retailerDisplayName)
                                      Text(DealTiming.endText(deal.validUntil))
                                          .font(.bw(.caption, weight: .bold))
                                          .foregroundStyle(BW.amber)
                                  }
                                  .padding(4)
                                  .padding(.trailing, 6)
                                  .background(.white.opacity(0.95), in: .capsule)
                              }
                          }
                          .padding(16)
                          .allowsHitTesting(false)
                      }
                  }
                  .shadow(color: BW.ink.opacity(0.14), radius: 20, y: 10)
              }

              private var divider: some View {
                  Rectangle().fill(.white.opacity(0.4)).frame(width: 1, height: 16)
              }

              private func stat(_ symbol: String, _ text: String) -> some View {
                  HStack(spacing: 5) {
                      Image(systemName: symbol)
                      Text(text).monospacedDigit()
                  }
                  .font(.bw(.subheadline, weight: .medium))
                  .foregroundStyle(.white)
              }
          }

          ''')

          WHOLE = [(R + "Views/Recipe/RecipeDetailView.swift", "struct RecipeDetailView: View {", r'''import SwiftUI

          struct RecipeDetailView: View {
              let recipe: Recipe
              @Environment(AppStore.self) private var store
              @State private var servings: Int
              @State private var cookedLog: CookLog? = nil
              @State private var addedToList: Int = 0
              @State private var showAddedToast: Bool = false
              @State private var toastText: String = ""
              @State private var showPaywall: Bool = false
              @State private var showGrocery: Bool = false
              @State private var tonightSet: Bool = false

              init(recipe: Recipe) {
                  self.recipe = recipe
                  _servings = State(initialValue: recipe.servings)
              }

              private var price: RecipePrice { store.price(for: recipe, servings: servings) }
              private var scored: ScoredRecipe { store.scored(recipe) }
              private var hasSavings: Bool { price.savings > 0.01 && !price.dealLines.isEmpty }
              private var dealEnd: Date? { price.dealLines.compactMap { $0.deal?.validUntil }.min() }
              private var regularPerServing: Double { price.regularTotal / Double(max(price.servings, 1)) }

              /// Unique stores that have a deal in this recipe, in order of appearance.
              private var dealStores: [(id: String, name: String)] {
                  var seen = Set<String>()
                  var out: [(id: String, name: String)] = []
                  for line in price.dealLines {
                      if let deal = line.deal, !seen.contains(deal.retailerId) {
                          seen.insert(deal.retailerId)
                          out.append((id: deal.retailerId, name: deal.retailerDisplayName))
                      }
                  }
                  return out
              }

              var body: some View {
                  ScrollView {
                      VStack(alignment: .leading, spacing: 20) {
                          hero
                          VStack(alignment: .leading, spacing: 20) {
                              titleBlock
                              statTiles
                              if hasSavings { savingsCard }
                              if let exclusion = store.exclusionReason(for: recipe) {
                                  warning(exclusion)
                              }
                              servingsStepper
                              ingredients
                              macros
                              steps
                              compatibility
                              sourceNote
                          }
                          .padding(.horizontal, 20)
                      }
                      .padding(.bottom, 160)
                  }
                  .background(BW.canvas)
                  .ignoresSafeArea(edges: .top)
                  .toolbar(.hidden, for: .tabBar)
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbar {
                      ToolbarItem(placement: .topBarTrailing) {
                          ShareLink(item: "\(recipe.title) on Lemora") {
                              Image(systemName: "square.and.arrow.up")
                          }
                      }
                  }
                  .safeAreaInset(edge: .bottom) { actionBar }
                  .sheet(item: $cookedLog) { log in
                      CookedView(recipe: recipe, logId: log.id)
                  }
                  .sheet(isPresented: $showPaywall) {
                      PaywallView(context: .upgrade) { showPaywall = false }
                  }
                  .sheet(isPresented: $showGrocery) { GroceryListView() }
                  .overlay(alignment: .top) {
                      if showAddedToast {
                          Label(toastText, systemImage: "checkmark.circle.fill")
                              .font(.bw(.subheadline, weight: .semibold))
                              .foregroundStyle(.white)
                              .padding(.horizontal, 18).padding(.vertical, 12)
                              .background(BW.leafDeep, in: .capsule)
                              .padding(.top, 60)
                              .padding(.horizontal, 20)
                              .transition(.move(edge: .top).combined(with: .opacity))
                      }
                  }
                  .onAppear { store.track("recipe_opened", ["recipe": recipe.id]) }
              }

              // MARK: Hero

              private var hero: some View {
                  FoodImage(name: recipe.imageName, height: 340, radius: 0)
                      .overlay(alignment: .bottomLeading) {
                          VStack(alignment: .leading, spacing: 8) {
                              if tonightSet {
                                  Label("Tonight's dinner is set", systemImage: "checkmark.circle.fill")
                                      .font(.bw(.subheadline, weight: .heavy))
                                      .foregroundStyle(BW.ink)
                                      .padding(.horizontal, 12).padding(.vertical, 7)
                                      .background(BW.lemon, in: .capsule)
                                      .transition(.scale.combined(with: .opacity))
                              }
                              HStack(spacing: 8) {
                                  MatchBadge(percent: scored.matchPercent, compact: true)
                                  ForEach(Array(recipe.tags.sorted { $0.rawValue < $1.rawValue }.prefix(2)), id: \.self) { tag in
                                      SoftChip(text: tag.title, fill: .white.opacity(0.94))
                                  }
                              }
                          }
                          .padding(16)
                      }
                      .overlay(alignment: .bottomTrailing) {
                          Button {
                              if store.isSaved(recipe) { store.unsave(recipe) } else { store.save(recipe) }
                          } label: {
                              Image(systemName: store.isSaved(recipe) ? "heart.fill" : "heart")
                                  .font(.title3.weight(.bold))
                                  .foregroundStyle(store.isSaved(recipe) ? BW.danger : BW.ink)
                                  .frame(width: 48, height: 48)
                                  .background(.white, in: .circle)
                                  .shadow(color: .black.opacity(0.12), radius: 8, y: 3)
                          }
                          .buttonStyle(BWPressableStyle())
                          .accessibilityLabel(store.isSaved(recipe) ? "Remove from saved" : "Save")
                          .sensoryFeedback(.impact(weight: .light), trigger: store.isSaved(recipe))
                          .padding(16)
                      }
              }

              private var titleBlock: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      Text(recipe.title).font(.bw(.title, weight: .heavy)).foregroundStyle(BW.ink)
                      Text(recipe.summary).font(.bw(.body, weight: .regular)).foregroundStyle(BW.inkSecondary)
                  }
              }

              // MARK: Stat tiles (protein · per serving · minutes)

              private var statTiles: some View {
                  HStack(spacing: 10) {
                      statTile(value: "\(recipe.nutrition.protein)g", label: String(localized: "protein"),
                               fill: BW.card, valueColor: BW.ink)
                      VStack(spacing: 2) {
                          Text(Money.format(price.perServing))
                              .font(.bw(size: 26, weight: .heavy)).monospacedDigit()
                              .foregroundStyle(BW.leafDeep)
                              .contentTransition(.numericText())
                              .minimumScaleFactor(0.7).lineLimit(1)
                          if hasSavings {
                              Text(Money.format(regularPerServing))
                                  .font(.bw(.caption, weight: .semibold)).monospacedDigit()
                                  .strikethrough().foregroundStyle(BW.inkSecondary)
                          }
                          Text("per serving").font(.bw(.caption, weight: .semibold)).foregroundStyle(BW.leafDeep)
                      }
                      .frame(maxWidth: .infinity, minHeight: 92)
                      .background(BW.leafSoft, in: .rect(cornerRadius: 18))
                      .overlay(RoundedRectangle(cornerRadius: 18).strokeBorder(BW.leafDeep.opacity(0.25), lineWidth: 1.5))
                      statTile(value: "\(recipe.totalMinutes)", label: String(localized: "minutes"),
                               fill: BW.card, valueColor: BW.ink)
                  }
                  .animation(.snappy, value: servings)
              }

              private func statTile(value: String, label: String, fill: Color, valueColor: Color) -> some View {
                  VStack(spacing: 2) {
                      Text(value).font(.bw(size: 26, weight: .heavy)).monospacedDigit().foregroundStyle(valueColor)
                          .minimumScaleFactor(0.7).lineLimit(1)
                      Text(label).font(.bw(.caption, weight: .semibold)).foregroundStyle(BW.inkSecondary)
                  }
                  .frame(maxWidth: .infinity, minHeight: 92)
                  .background(fill, in: .rect(cornerRadius: 18))
                  .overlay(RoundedRectangle(cornerRadius: 18).strokeBorder(BW.hairline))
              }

              // MARK: Savings card

              private var savingsCard: some View {
                  let count = price.dealLines.count
                  let storeNames = dealStores.map(\.name).joined(separator: ", ")
                  return VStack(alignment: .leading, spacing: 14) {
                      HStack(alignment: .top) {
                          VStack(alignment: .leading, spacing: 0) {
                              Text("You save").font(.bw(.subheadline, weight: .semibold)).foregroundStyle(.white.opacity(0.7))
                              Text(Money.format(price.savings))
                                  .font(.bw(size: 46, weight: .heavy)).monospacedDigit()
                                  .foregroundStyle(.white)
                                  .contentTransition(.numericText())
                          }
                          Spacer(minLength: 8)
                          if let end = dealEnd {
                              Label(DealTiming.endText(end), systemImage: "timer")
                                  .font(.bw(.caption, weight: .heavy))
                                  .foregroundStyle(BW.lemon)
                                  .padding(.horizontal, 10).padding(.vertical, 6)
                                  .background(.white.opacity(0.1), in: .capsule)
                          }
                      }

                      Text(count == 1
                           ? String(localized: "1 ingredient in this meal is on sale at \(storeNames)")
                           : String(localized: "\(count) ingredients in this meal are on sale at \(storeNames)"))
                          .font(.bw(.subheadline, weight: .semibold))
                          .foregroundStyle(.white.opacity(0.85))
                          .fixedSize(horizontal: false, vertical: true)

                      VStack(spacing: 8) {
                          ForEach(price.dealLines) { line in
                              if let deal = line.deal {
                                  HStack(spacing: 10) {
                                      StoreChip(retailerId: deal.retailerId, name: deal.retailerDisplayName)
                                      Text("\(IngredientCatalog.emoji(line.ingredientId)) \(IngredientCatalog.name(line.ingredientId))")
                                          .font(.bw(.subheadline, weight: .semibold))
                                          .foregroundStyle(.white)
                                          .lineLimit(1)
                                      Spacer(minLength: 6)
                                      Text(Money.format(line.regularCost))
                                          .font(.bw(.footnote, weight: .medium)).monospacedDigit()
                                          .strikethrough().foregroundStyle(.white.opacity(0.5))
                                      Text(Money.format(line.cost))
                                          .font(.bw(.title3, weight: .heavy)).monospacedDigit()
                                          .foregroundStyle(BW.lemon)
                                  }
                                  .padding(.horizontal, 12).padding(.vertical, 10)
                                  .background(.white.opacity(0.08), in: .rect(cornerRadius: 14))
                              }
                          }
                      }

                      HStack(spacing: 6) {
                          Image(systemName: "fork.knife")
                          Text("\(Money.format(price.perServing)) per serving instead of \(Money.format(regularPerServing))")
                              .monospacedDigit()
                      }
                      .font(.bw(.caption, weight: .semibold))
                      .foregroundStyle(.white.opacity(0.7))
                  }
                  .padding(20)
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .background(BW.ink, in: .rect(cornerRadius: BW.cardRadius))
                  .animation(.snappy, value: servings)
              }

              private var macros: some View {
                  let n = recipe.nutrition
                  return VStack(alignment: .leading, spacing: 8) {
                      Text("Nutrition").font(.bw(.title3)).foregroundStyle(BW.ink)
                      HStack(spacing: 8) {
                          macro("\(n.protein)g", String(localized: "protein"), highlight: true)
                          macro("\(n.carbs)g", String(localized: "carbs"))
                          macro("\(n.fat)g", String(localized: "fat"))
                          macro("\(n.calories)", String(localized: "kcal"))
                      }
                      if n.status != .verified {
                          Text("Nutrition is estimated per serving.").font(.bw(.caption2, weight: .medium)).foregroundStyle(BW.inkSecondary)
                      }
                  }
              }

              private func macro(_ value: String, _ label: String, highlight: Bool = false) -> some View {
                  VStack(spacing: 2) {
                      Text(value).font(.bw(.headline, weight: .heavy)).monospacedDigit().foregroundStyle(BW.ink)
                      Text(label).font(.bw(.caption, weight: .medium)).foregroundStyle(BW.inkSecondary)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(.vertical, 12)
                  .background(highlight ? BW.lemon.opacity(0.6) : BW.card, in: .rect(cornerRadius: 16))
              }

              private func warning(_ text: String) -> some View {
                  HStack(spacing: 10) {
                      Image(systemName: "exclamationmark.triangle.fill").foregroundStyle(BW.danger)
                      Text("Not a match for your profile: \(text)").font(.bw(.subheadline, weight: .semibold)).foregroundStyle(BW.ink)
                  }
                  .padding(14)
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .background(BW.danger.opacity(0.1), in: .rect(cornerRadius: 16))
              }

              private var servingsStepper: some View {
                  HStack {
                      Text("Servings").font(.bw(.headline)).foregroundStyle(BW.ink)
                      Spacer()
                      Button { if servings > 1 { servings -= 1 } } label: {
                          Image(systemName: "minus").frame(width: 44, height: 44).background(BW.card, in: .circle)
                      }
                      .accessibilityLabel("Fewer servings")
                      Text("\(servings)").font(.bw(.title3, weight: .heavy)).monospacedDigit().frame(minWidth: 36)
                          .contentTransition(.numericText())
                      Button { if servings < 12 { servings += 1 } } label: {
                          Image(systemName: "plus").frame(width: 44, height: 44).background(BW.card, in: .circle)
                      }
                      .accessibilityLabel("More servings")
                  }
                  .foregroundStyle(BW.ink)
                  .animation(.snappy, value: servings)
                  .sensoryFeedback(.selection, trigger: servings)
              }

              // MARK: Ingredients with store + sale price

              private var ingredients: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      HStack(alignment: .firstTextBaseline) {
                          Text("Ingredients").font(.bw(.title3)).foregroundStyle(BW.ink)
                          Spacer()
                          if hasSavings {
                              Text(Money.format(price.regularTotal))
                                  .font(.bw(.footnote, weight: .medium)).monospacedDigit()
                                  .strikethrough().foregroundStyle(BW.inkSecondary)
                          }
                          Text("~\(Money.format(price.total)) total").font(.bw(.subheadline, weight: .heavy)).monospacedDigit()
                              .foregroundStyle(hasSavings ? BW.leafDeep : BW.inkSecondary)
                      }
                      VStack(spacing: 0) {
                          ForEach(Array(price.lines.enumerated()), id: \.element.id) { idx, line in
                              ingredientRow(line)
                              if idx < price.lines.count - 1 { Divider().overlay(BW.hairline).padding(.leading, 60) }
                          }
                      }
                      .bwCard()
                      if price.usesSampleData { SamplePricesNote() }
                  }
              }

              @ViewBuilder
              private func ingredientRow(_ line: PriceLine) -> some View {
                  let onSale = line.deal != nil && line.savings > 0.01
                  HStack(spacing: 12) {
                      Text(IngredientCatalog.emoji(line.ingredientId)).font(.title3).frame(width: 32)
                      VStack(alignment: .leading, spacing: 4) {
                          Text(IngredientCatalog.name(line.ingredientId)).font(.bw(.body, weight: .semibold)).foregroundStyle(BW.ink)
                          HStack(spacing: 6) {
                              Text(line.unit.format(line.quantity)).font(.bw(.footnote, weight: .regular)).foregroundStyle(BW.inkSecondary)
                              if onSale, let deal = line.deal {
                                  StoreChip(retailerId: deal.retailerId, name: deal.retailerDisplayName)
                              }
                          }
                      }
                      Spacer()
                      if onSale {
                          VStack(alignment: .trailing, spacing: 2) {
                              Text(Money.format(line.regularCost))
                                  .font(.bw(.caption, weight: .medium)).monospacedDigit()
                                  .strikethrough().foregroundStyle(BW.inkSecondary)
                              Text(Money.format(line.cost))
                                  .font(.bw(.headline, weight: .heavy)).monospacedDigit()
                                  .foregroundStyle(BW.leafDeep)
                          }
                      } else {
                          Text(Money.format(line.cost)).font(.bw(.subheadline, weight: .medium)).monospacedDigit().foregroundStyle(BW.inkSecondary)
                      }
                  }
                  .padding(.horizontal, 16)
                  .padding(.vertical, 12)
                  .background(onSale ? BW.leafSoft : Color.clear)
              }

              private var steps: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Text("Instructions").font(.bw(.title3)).foregroundStyle(BW.ink)
                      ForEach(Array(recipe.steps.enumerated()), id: \.offset) { idx, step in
                          HStack(alignment: .top, spacing: 14) {
                              Text("\(idx + 1)")
                                  .font(.bw(.subheadline, weight: .heavy)).foregroundStyle(BW.ink)
                                  .frame(width: 30, height: 30).background(BW.lemon, in: .circle)
                              Text(step).font(.bw(.body, weight: .regular)).foregroundStyle(BW.ink)
                                  .fixedSize(horizontal: false, vertical: true)
                          }
                      }
                  }
              }

              private var compatibility: some View {
                  let allergens = store.allergens(of: recipe)
                  return VStack(alignment: .leading, spacing: 10) {
                      Text("Diet & allergens").font(.bw(.title3)).foregroundStyle(BW.ink)
                      ChipFlow(items: store.compatibility(of: recipe).map(\.0)) { diet in
                          let state = store.compatibility(of: recipe).first { $0.0 == diet }?.1 ?? .uncertain
                          TriStateBadge(title: diet.title, state: state)
                      }
                      if !allergens.contains.isEmpty {
                          Text("Contains: \(allergens.contains.map(\.title).joined(separator: ", "))")
                              .font(.bw(.subheadline, weight: .semibold)).foregroundStyle(BW.ink)
                      }
                      if !allergens.mayContain.isEmpty {
                          Text("May contain: \(allergens.mayContain.map(\.title).joined(separator: ", ")). Always check product labels.")
                              .font(.bw(.footnote, weight: .medium)).foregroundStyle(BW.amber)
                      }
                  }
              }

              private var sourceNote: some View {
                  Text("Source: \(recipe.source.title)")
                      .font(.bw(.caption, weight: .medium)).foregroundStyle(BW.inkSecondary)
              }

              // MARK: Bottom actions

              private func toast(_ text: String) {
                  toastText = text
                  withAnimation(.spring) { showAddedToast = true }
                  Task {
                      try? await Task.sleep(for: .seconds(1.8))
                      withAnimation { showAddedToast = false }
                  }
              }

              private var actionBar: some View {
                  VStack(spacing: 10) {
                      if let entry = store.savedEntry(recipe), let expiry = entry.expiresAt {
                          Button { showPaywall = true } label: {
                              Text("Saved for \(expiry, format: .relative(presentation: .named)) · Save forever with Premium")
                                  .font(.bw(.caption, weight: .semibold)).foregroundStyle(BW.inkSecondary)
                          }
                      }

                      Button {
                          store.addToGrocery(recipe, servings: servings)
                          store.track("cook_tonight", ["recipe": recipe.id])
                          addedToList += 1
                          withAnimation(.spring) { tonightSet = true }
                          toast(String(localized: "Tonight's dinner is set · added to your list"))
                      } label: {
                          HStack(spacing: 8) {
                              Image(systemName: tonightSet ? "checkmark.circle.fill" : "fork.knife")
                              if hasSavings {
                                  Text("Cook this tonight · save \(Money.format(price.savings))").monospacedDigit()
                              } else {
                                  Text("Cook this tonight")
                              }
                          }
                          .lineLimit(1).minimumScaleFactor(0.8)
                      }
                      .buttonStyle(BWPrimaryButtonStyle())
                      .sensoryFeedback(.success, trigger: addedToList)

                      HStack(spacing: 10) {
                          Button { showGrocery = true } label: {
                              Label("View grocery list", systemImage: "cart")
                          }
                          .buttonStyle(BWSecondaryButtonStyle())

                          Button {
                              cookedLog = store.cook(recipe)
                          } label: {
                              Image(systemName: "frying.pan")
                                  .font(.title3.weight(.semibold))
                                  .foregroundStyle(BW.ink)
                                  .frame(width: 56, height: 56)
                                  .background(BW.card, in: .circle)
                                  .overlay(Circle().strokeBorder(BW.hairline))
                          }
                          .accessibilityLabel("I cooked this")
                      }
                  }
                  .padding(.horizontal, 20)
                  .padding(.top, 12)
                  .padding(.bottom, 8)
                  .background(BW.canvas.opacity(0.97))
              }
          }
          ''')]

          def main(root="."):
              for path, start, end, new in BETWEEN:
                  p = os.path.join(root, path)
                  s = open(p, encoding="utf-8").read()
                  if s.count(start) != 1 or s.count(end) != 1:
                      sys.exit(f"Markers not unique in {path}: start={s.count(start)} end={s.count(end)}")
                  i, j = s.index(start), s.index(end)
                  if j <= i:
                      sys.exit(f"Markers out of order in {path}")
                  s = s[:i] + new + s[j:]
                  open(p, "w", encoding="utf-8").write(s)
                  print("edited", p)
              for path, marker, new in WHOLE:
                  p = os.path.join(root, path)
                  s = open(p, encoding="utf-8").read()
                  if s.count(marker) != 1:
                      sys.exit(f"Marker missing in {path}")
                  open(p, "w", encoding="utf-8").write(new)
                  print("replaced", p)

          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-deals.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deals and Discover redesign; recipe page shows savings, stores and sale prices"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
