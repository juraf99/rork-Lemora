name: Lemora name on Discover and Deals

# One-shot: big "lemora" wordmark replaces the greeting and "Fresh deals for you". Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-brand.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          cat > /tmp/edits.py <<'PYEOF'
          """Show the big "lemora" wordmark at the top of Discover and Deals."""
          import sys, os
          R = "ios-bitewise/Lemora/"
          EDITS = [
              ("Views/Deals/DealsView.swift",
               '                Text("Fresh deals for you")\n                    .font(.bw(.title, weight: .heavy))\n                    .foregroundStyle(BW.ink)',
               '                LemoraWordmark(size: 44, color: BW.ink)', 1),
              ("Views/Deals/DealsView.swift",
               'String(localized: "From this week’s sales',
               'String(localized: "Fresh deals from this week’s sales', 3),
              ("Views/Discover/DiscoverView.swift",
               '                Text(greeting)\n                    .font(.bw(.title, weight: .heavy))\n                    .foregroundStyle(BW.ink)',
               '                LemoraWordmark(size: 44, color: BW.ink)', 1),
              ("Views/Discover/DiscoverView.swift",
               '                Text(subtitle)\n                    .font(.bw(.subheadline, weight: .regular))',
               '                Text("\\(greeting) \\(subtitle)")\n                    .font(.bw(.subheadline, weight: .regular))', 1),
          ]
          def main(root="."):
              for path, old, new, n in EDITS:
                  p = os.path.join(root, R + path)
                  s = open(p, encoding="utf-8").read()
                  if s.count(old) != n:
                      sys.exit(f"Anchor count {s.count(old)} != {n} in {path}: {old[:60]!r}")
                  open(p, "w", encoding="utf-8").write(s.replace(old, new))
                  print("edited", p)
          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-brand.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Show the lemora wordmark at the top of Discover and Deals"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
