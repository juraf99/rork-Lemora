name: Profile editors like onboarding

# One-shot: Profile > My Lemora editors reuse the onboarding screens. Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-prefs.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          cat > /tmp/edits.py <<'PYEOF'
          """Profile > My Lemora editors now use the same screens as the onboarding (Zesty bubble, emoji cards, check circles)."""
          import sys

          R = "ios-bitewise/Lemora/"
          EDITS = []

          def edit(path, old, new, count=1):
              EDITS.append((R + path, old, new, count))

          P = "Views/Profile/ProfileView.swift"

          def editor(name, old_body, screen, title, sub, mood, content, apply):
              edit(P,
                   "struct %s: View { var body: some View { ProfileEditor { %s } } }" % (name, old_body),
                   """struct %s: View {
              var body: some View {
                  OnboardingPrefEditor(screen: .%s, title: "%s", subtitle: "%s", mood: .%s,
                                       apply: { m, p in
                                           let new = m.makeProfile(base: p)
                                           %s
                                       }) {
                      %s
                  }
              }
          }""" % (name, screen, title, sub, mood, apply, content))

          editor("GoalEditView", "GoalStep(profile: $0)", "goal", "What’s your main goal?", "This shapes everything I recommend.", "idea",
                 "OBGoalStep()", "p.goal = new.goal")
          editor("DietEditView", "DietStep(profile: $0)", "diet", "Do you follow a specific diet?", "Pick all that apply. I’ll keep them compatible.", "talking",
                 "OBDietStep()", "p.diets = new.diets")
          editor("AllergyEditView", "AllergyStep(profile: $0)", "allergies", "Do you have any food allergies?", "These are strict. I’ll never show recipes with them.", "curious",
                 "OBAllergyStep()",
                 "let kept = p.allergyRefs.filter { old in old.kind == .ingredient && !new.allergyRefs.contains { $0.id == old.id } }\n"
                 "                                 p.hasNoAllergies = new.hasNoAllergies\n"
                 "                                 p.allergyRefs = new.allergyRefs + kept")
          editor("DislikeEditView", "DislikeStep(profile: $0)", "dislikes", "Anything you’d rather not eat?", "Tap a few or search any ingredient.", "talking",
                 "OBDislikeStep()", "p.dislikedIngredients = new.dislikedIngredients")
          editor("CuisineEditView", "CuisineStep(profile: $0)", "branch", "What do you love eating?", "Pick a few. Swipes refine the rest.", "idle",
                 "OBTasteStep()", "p.cuisines = new.cuisines")
          editor("MealTypeEditView", "MealTypeStep(profile: $0)", "meals", "What kind of recipes are you looking for?", "Pick the meals you want ideas for.", "idea",
                 "OBMealStep()", "p.mealTypes = new.mealTypes")
          editor("BudgetEditView", "BudgetStep(profile: $0)", "budget", "What’s your weekly grocery budget?", "For your whole household.", "thinking",
                 "OBBudgetStep()\n            OBText(\"How many people do you cook for each week?\", 17, 800).padding(.top, 8)\n            OBPeopleStep()",
                 "p.weeklyBudget = new.weeklyBudget\n                                 p.householdSize = new.householdSize")
          editor("StrategyEditView", "StrategyStep(profile: $0)", "strategy", "How do you like to shop?", "I’ll plan your list around this.", "cart",
                 "OBStrategyStep()", "p.strategy = new.strategy\n                                 p.maxStores = new.maxStores")

          edit(P,
          """// MARK: - Editors (reuse onboarding steps so everything stays editable)
          """,
          """// MARK: - Editors (reuse onboarding steps so everything stays editable)

          /// Shows one onboarding screen (same cards, emojis and Zesty bubble) to edit a saved preference.
          /// Changes are saved when leaving the screen; only the edited field is written back.
          struct OnboardingPrefEditor<Content: View>: View {
              @Environment(AppStore.self) private var store
              @State private var model: OnboardingModel?
              let screen: OnboardingModel.Screen
              let title: String
              let subtitle: String
              let mood: ZestyMascot.Mood
              let apply: @MainActor (OnboardingModel, inout UserProfile) -> Void
              @ViewBuilder let content: () -> Content

              var body: some View {
                  ZStack {
                      OB.cream.ignoresSafeArea()
                      if let model {
                          ScrollView {
                              VStack(alignment: .leading, spacing: 18) {
                                  HStack(alignment: .center, spacing: 10) {
                                      ZestyMascot(mood: mood, size: 64, seedKey: "pf-" + screen.rawValue)
                                      VStack(alignment: .leading, spacing: 4) {
                                          Text(title).font(OB.font(20, 800)).foregroundStyle(OB.ink)
                                              .fixedSize(horizontal: false, vertical: true)
                                          Text(subtitle).font(OB.font(13, 500)).foregroundStyle(OB.sub)
                                              .fixedSize(horizontal: false, vertical: true)
                                      }
                                      .padding(.horizontal, 16).padding(.vertical, 14)
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .background(.white, in: .rect(cornerRadius: 24))
                                      .shadow(color: OB.ink.opacity(0.06), radius: 8, x: 0, y: 3)
                                  }
                                  content()
                              }
                              .padding(.horizontal, 20)
                              .padding(.top, 8)
                              .padding(.bottom, 32)
                          }
                          .scrollDismissesKeyboard(.interactively)
                          .environment(model)
                      }
                  }
                  .toolbar(.hidden, for: .tabBar)
                  .onAppear {
                      guard model == nil else { return }
                      let m = OnboardingModel(entry: .signedOut)
                      m.a = OnboardingAnswers(profile: store.data.profile)
                      m.screen = screen
                      model = m
                  }
                  .onDisappear {
                      guard let model else { return }
                      store.updateProfile { apply(model, &$0) }
                  }
              }
          }

          extension OnboardingAnswers {
              /// Onboarding answers matching a saved profile, so the profile editors can reuse the onboarding screens.
              init(profile p: UserProfile) {
                  self.init()
                  let goals: [Goal: String] = [.saveMoney: "save_money", .eatHealthier: "eat_healthier", .loseWeight: "lose_weight",
                                               .buildMuscle: "build_muscle", .gainWeight: "gain_weight", .maintain: "maintain_weight",
                                               .discover: "discover_meals", .mealPrep: "meal_prep"]
                  goal = goals[p.goal] ?? "save_money"
                  unit = p.usesMetric ? "kg" : "lb"
                  let cuisines: [Cuisine: String] = [.italian: "italian", .mexican: "mexican", .japanese: "japanese", .korean: "korean",
                                                     .indian: "indian", .greek: "greek", .middleEastern: "lebanese", .french: "french",
                                                     .thai: "thai", .vietnamese: "vietnamese", .caribbean: "caribbean", .american: "comfort"]
                  if p.cuisines.isEmpty || p.cuisines.isSuperset(of: Set(Cuisine.allCases)) {
                      self.cuisines = ["all"]
                  } else {
                      self.cuisines = cuisines.filter { p.cuisines.contains($0.key) }.map(\\.value).sorted()
                  }
                  let diets: [DietPreference: String] = [.plantBased: "plant_based", .wholeFood: "whole_food", .mediterranean: "mediterranean",
                                                         .flexitarian: "flexitarian", .pescatarian: "pescatarian", .vegetarian: "vegetarian",
                                                         .vegan: "vegan", .lowCarb: "low_carb", .keto: "keto", .highProtein: "high_protein",
                                                         .glutenFree: "gluten_free", .lactoseFree: "lactose_free", .halal: "halal", .kosher: "kosher"]
                  let picked = diets.filter { p.diets.contains($0.key) }.map(\\.value).sorted()
                  self.diets = picked.isEmpty ? ["none"] : picked
                  allergies = p.allergyRefs.filter { $0.kind == .allergen }.map { $0.id == "tree_nuts" ? "tree_nut" : $0.id }
                  noAllergy = p.hasNoAllergies
                  dislikes = p.dislikedIngredients.map { Dislike(id: $0.id, name: $0.name) }
                  meals = MealType.allCases.filter { p.mealTypes.contains($0) }.map(\\.rawValue)
                  household = max(1, p.householdSize)
                  noBudget = p.weeklyBudget == nil
                  budget = Int((p.weeklyBudget ?? 120).rounded())
                  budgetTouched = true
                  switch p.strategy {
                  case .convenience: strategy = "one"
                  case .maximumSavings: strategy = "max"
                  default: strategy = "balanced"
                  }
                  referral = "other"
                  reachedPlan = true
              }
          }
          """)

          def main(root="."):
              import os
              files = {}
              for path, old, new, count in EDITS:
                  p = os.path.join(root, path)
                  s = files.get(p) or open(p, encoding="utf-8").read()
                  n = s.count(old)
                  if n != count:
                      sys.exit(f"Anchor found {n}x (expected {count}) in {path}:\n{old[:120]}")
                  files[p] = s.replace(old, new)
              for p, s in files.items():
                  open(p, "w", encoding="utf-8").write(s)
                  print("edited", p)

          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-prefs.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Profile preference editors use the onboarding screens (same cards and emojis)"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
