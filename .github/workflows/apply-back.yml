name: Back buttons after the plan

# One-shot: back from the plan (to the questions), account and paywall (to the plan); finishing the
# questions again goes straight to the plan. Commits, starts the TestFlight build, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-back.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          cat > /tmp/edits.py <<'PYEOF'
          """Back buttons after the questions: plan -> last question, account and paywall -> plan.
          Once the plan has been shown, finishing the questions again goes straight to the plan
          (no thanks / notifications / generating / savings screens a second time)."""
          import sys

          R = "ios-bitewise/Lemora/"
          EDITS = []

          def edit(path, old, new, count=1):
              EDITS.append((R + path, old, new, count))

          O = "Views/Onboarding/"

          # Last question -> plan directly when the plan was already built (used by both next() and skip()).
          edit(O + "OnboardingModel.swift",
          """        go(i < Self.steps.count - 1 ? Self.steps[i + 1] : .thanks)""",
          """        go(i < Self.steps.count - 1 ? Self.steps[i + 1] : (a.reachedPlan == true ? .plan : .thanks))""",
          count=2)

          # Plan: back to the last question.
          edit(O + "OnboardingFinal.swift",
          """        VStack(alignment: .leading, spacing: 0) {
                      HStack(spacing: 10) {
                          ZestyMascot(mood: .idle, size: 54, seedKey: "pl")""",
          """        VStack(alignment: .leading, spacing: 0) {
                      HStack {
                          OBBackButton(size: 38) { m.go(OnboardingModel.steps.last ?? .strategy) }
                          Spacer()
                      }
                      .padding(.bottom, 6)
                      HStack(spacing: 10) {
                          ZestyMascot(mood: .idle, size: 54, seedKey: "pl")""")

          # Account: back to the plan.
          edit(O + "OnboardingFinal.swift",
          """            Spacer(minLength: 0)
                      VStack(spacing: 0) {
                          ZestyMascot(mood: .talking, size: 110, seedKey: "ac")""",
          """            HStack {
                          OBBackButton(size: 38) { m.go(.plan) }
                          Spacer()
                      }
                      Spacer(minLength: 0)
                      VStack(spacing: 0) {
                          ZestyMascot(mood: .talking, size: 110, seedKey: "ac")""")

          # Paywall: back to the plan (top-left; the tester X stays top-right).
          edit(O + "OnboardingFinal.swift",
          """        .sheet(isPresented: $showPrivacy) { NavigationStack { PrivacyView() } }
                  .task { if !sub.productsAvailable""",
          """        .overlay(alignment: .topLeading) {
                      OBBackButton(size: 34) { m.go(.plan) }
                          .padding(.top, 4)
                          .padding(.leading, 16)
                  }
                  .sheet(isPresented: $showPrivacy) { NavigationStack { PrivacyView() } }
                  .task { if !sub.productsAvailable""")

          def main(root="."):
              import os
              files = {}
              for path, old, new, count in EDITS:
                  p = os.path.join(root, path)
                  s = files.get(p) or open(p, encoding="utf-8").read()
                  n = s.count(old)
                  if n != count:
                      sys.exit(f"Anchor found {n}x (expected {count}) in {path}:\n{old[:120]}")
                  files[p] = s.replace(old, new)
              for p, s in files.items():
                  open(p, "w", encoding="utf-8").write(s)
                  print("edited", p)

          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-back.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Back buttons on plan, account and paywall; returning to the plan skips the build animation"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
