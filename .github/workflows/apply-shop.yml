name: Where you shop and Zesty swaps

# One-shot: postal code / ZIP or Apple location in "Where do you shop", nearby stores,
# strict deal matching and Zesty's cheaper near-identical swaps. Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-shop.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

