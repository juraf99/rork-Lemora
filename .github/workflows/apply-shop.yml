      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Where you shop: postal code, location and nearby stores; strict deal matching and Zesty smart swaps"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
