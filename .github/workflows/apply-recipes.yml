name: Complete recipe catalogue in the app

# One-shot: recipes show price per serving, protein, calories and store prices from Supabase. Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-recipes.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
