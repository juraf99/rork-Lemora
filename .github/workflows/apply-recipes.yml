              /// Flyer ingredient ids that can discount this catalogue ingredient (always includes itself).
              static func dealIds(for id: String) -> [String] {
                  var out = [id]
                  for alias in info[id]?.dealIds ?? [] where !out.contains(alias) { out.append(alias) }
                  return out
              }
          }

          /// Average regular price per serving at each banner (estimated, before deals).
          struct StorePricesCard: View {
              let prices: [String: Double]

              private var rows: [(id: String, price: Double)] {
                  prices.map { (id: $0.key, price: $0.value) }.sorted { $0.price < $1.price }
              }

              var body: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      VStack(alignment: .leading, spacing: 2) {
                          Text("Price per serving by store").font(.bw(.title3)).foregroundStyle(BW.ink)
                          Text("Average regular prices, before this week's deals.")
                              .font(.bw(.caption, weight: .medium)).foregroundStyle(BW.inkSecondary)
                      }
                      VStack(spacing: 0) {
                          ForEach(Array(rows.enumerated()), id: \.element.id) { idx, row in
                              HStack(spacing: 10) {
                                  StoreChip(retailerId: row.id, name: RetailerCatalog.name(row.id))
                                  if idx == 0 {
                                      Text("Cheapest")
                                          .font(.bw(.caption2, weight: .heavy)).foregroundStyle(BW.leafDeep)
                                          .padding(.horizontal, 8).padding(.vertical, 3)
                                          .background(BW.leafSoft, in: .capsule)
                                  }
                                  Spacer()
                                  Text(Money.format(row.price))
                                      .font(.bw(.headline, weight: idx == 0 ? .heavy : .semibold)).monospacedDigit()
                                      .foregroundStyle(idx == 0 ? BW.leafDeep : BW.ink)
                              }
                              .padding(.horizontal, 16).padding(.vertical, 11)
                              if idx < rows.count - 1 { Divider().overlay(BW.hairline).padding(.leading, 16) }
                          }
                      }
                      .bwCard()
                  }
              }
          }
          '''
          EDITS = [('ViewModels/AppStore.swift', '            if !fetched.isEmpty { recipes = fetched }', '            if !fetched.isEmpty {\n                let fetchedIds = Set(fetched.map(\\.id))\n                recipes = fetched + RecipeCatalog.all.filter { !fetchedIds.contains($0.id) }\n            }'), ('Services/SupabaseService.swift', '                estimatedCost: nil', '                estimatedCost: item.estimatedCost'), ('Services/SupabaseService.swift', '    let unit: String\n    enum CodingKeys: String, CodingKey {\n        case normalizedName = "normalized_name"\n        case name, quantity, unit\n    }', '    let unit: String\n    let estimatedCost: Double?\n    enum CodingKeys: String, CodingKey {\n        case normalizedName = "normalized_name"\n        case name, quantity, unit\n        case estimatedCost = "estimated_cost"\n    }'), ('Services/SupabaseService.swift', 'private nonisolated struct RemotePrice: Decodable, Sendable { let status: String? }', 'private nonisolated struct RemotePrice: Decodable, Sendable {\n    let status: String?\n    let perServing: Double?\n    let byStore: [String: Double]?\n    enum CodingKeys: String, CodingKey {\n        case status\n        case perServing = "per_serving"\n        case byStore = "by_store_per_serving"\n    }\n}'), ('Services/SupabaseService.swift', '            priceStatus: NutritionStatus(rawValue: payload.price?.status ?? "unknown") ?? .unknown\n', '            priceStatus: NutritionStatus(rawValue: payload.price?.status ?? "unknown") ?? .unknown,\n            storePricesPerServing: payload.price?.byStore ?? [:]\n'), ('Models/Recipe.swift', '    var priceStatus: NutritionStatus = .estimated\n', '    var priceStatus: NutritionStatus = .estimated\n    /// Estimated average regular price per serving by banner id (before deals).\n    var storePricesPerServing: [String: Double] = [:]\n'), ('Services/PricingEngine.swift', '        default: [ingredientId]', '        default: CatalogIngredientInfo.dealIds(for: ingredientId)'), ('Data/IngredientCatalog.swift', '    static func name(_ id: String) -> String { all[id]?.name ?? id.replacingOccurrences(of: "_", with: " ").capitalized }', '    static func name(_ id: String) -> String {\n        all[id]?.name ?? CatalogIngredientInfo.info[id]?.name ?? id.replacingOccurrences(of: "_", with: " ").capitalized\n    }'), ('Data/IngredientCatalog.swift', '        default: "🛒"', '        default: CatalogIngredientInfo.info[id]?.emoji ?? "🛒"'), ('Views/Saved/GroceryListView.swift', 'IngredientCatalog.ingredient($0.ingredientId)?.category.title ?? String(localized: "Other")', '(IngredientCatalog.ingredient($0.ingredientId)?.category ?? CatalogIngredientInfo.info[$0.ingredientId]?.category)?.title ?? String(localized: "Other")'), ('Views/Recipe/RecipeDetailView.swift', '                    if hasSavings { savingsCard }\n', '                    if hasSavings { savingsCard }\n                    if !recipe.storePricesPerServing.isEmpty { StorePricesCard(prices: recipe.storePricesPerServing) }\n'), ('Views/Discover/DiscoverView.swift', '                        divider\n                        stat("clock", "\\(item.recipe.totalMinutes) min")', '                        if let kcal = item.recipe.nutrition.calories {\n                            divider\n                            stat("flame", "\\(kcal) kcal")\n                        }\n                        divider\n                        stat("clock", "\\(item.recipe.totalMinutes) min")')]
          def main(root="."):
              for path, old, new in EDITS:
                  p = os.path.join(root, R + path)
                  s = open(p, encoding="utf-8").read()
                  if s.count(old) != 1:
                      sys.exit(f"Anchor count {s.count(old)} in {path}: {old[:70]!r}")
                  open(p, "w", encoding="utf-8").write(s.replace(old, new))
                  print("edited", p)
              p = os.path.join(root, R + "Data/CatalogIngredientInfo.swift")
              if os.path.exists(p):
                  sys.exit("CatalogIngredientInfo.swift already exists")
              open(p, "w", encoding="utf-8").write(INFO)
              print("created", p)
          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-recipes.yml
          git add -A
          git status --short
