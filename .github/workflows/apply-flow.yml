name: Same onboarding for everyone

# One-shot: reopening the app -> "Your Lemora plan" if every question was answered, otherwise "Get started".
# Signed in without a subscription -> plan. Signing out starts fresh. Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-flow.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          cat > /tmp/edits.py <<'PYEOF'
          """Reopening the app: all questions answered -> "Your Lemora plan"; otherwise -> "Get started" / "Log in".
          Signed in without a subscription -> plan (not straight to the paywall). Signing out starts fresh."""
          import sys

          R = "ios-bitewise/Lemora/"
          EDITS = []

          def edit(path, old, new, count=1):
              EDITS.append((R + path, old, new, count))

          O = "Views/Onboarding/"

          edit("ContentView.swift",
          """                    LemoraOnboardingView()
                                  .id("onboarding")""",
          """                    LemoraOnboardingView(entry: store.isSignedIn ? .signedIn : .signedOut)
                                  .id("onboarding")""")

          edit("ContentView.swift",
          """                    LemoraOnboardingView(startAt: .paywall)
                                  .id("paywall")""",
          """                    LemoraOnboardingView(entry: .lapsed)
                                  .id("paywall")""")

          edit(O + "LemoraOnboardingView.swift",
          """    init(startAt: OnboardingModel.Screen? = nil) {
                  _model = State(initialValue: OnboardingModel(startAt: startAt))
              }""",
          """    init(entry: OnboardingModel.Entry = .signedOut) {
                  _model = State(initialValue: OnboardingModel(entry: entry))
              }""")

          edit(O + "LemoraOnboardingView.swift",
          """            store.track("onboarding_v2_viewed", ["screen": model.screen.rawValue])
                  }""",
          """            store.track("onboarding_v2_viewed", ["screen": model.screen.rawValue])
                  }
                  .task { await model.restoreRemoteAnswersIfNeeded() }""")

          edit(O + "OnboardingModel.swift",
          """    var completed: Bool = false
          """,
          """    var completed: Bool = false
              /// True once the user has seen their personalized plan (all questions answered).
              var reachedPlan: Bool? = nil
          """)

          edit(O + "OnboardingModel.swift",
          """        if s == .generating { startGen() }""",
          """        if s == .plan { a.reachedPlan = true }
                  if s == .generating { startGen() }""")

          edit(O + "OnboardingModel.swift",
          """    init(startAt: Screen? = nil) {
                  let saved = UserDefaults.standard.data(forKey: Self.storageKey)
                      .flatMap { try? JSONDecoder().decode(OnboardingAnswers.self, from: $0) }
                  a = saved ?? OnboardingAnswers()
                  if let startAt {
                      screen = startAt
                      paywallOnly = startAt == .paywall
                  } else if let raw = UserDefaults.standard.string(forKey: Self.screenKey), let s = Screen(rawValue: raw),
                            ![.generating, .done, .verify, .email, .signin].contains(s) {
                      screen = s
                  } else {
                      screen = .landing
                  }
                  if screen == .savings { startCount() }
              }""",
          """    /// How the app was opened. Reopening the app always lands on one of two pages:
              /// - all questions answered (even if they quit on the account page or the paywall) -> "Your Lemora plan";
              /// - otherwise -> the very first page ("Get started" / "Log in"), with fresh answers.
              /// - lapsed: finished before but no active subscription -> plan, then paywall.
              enum Entry { case signedOut, signedIn, lapsed }

              @ObservationIgnored private var needsRemoteAnswers = false

              /// Screens that only come after the last question.
              private static let afterQuestions: Set<Screen> = [.thanks, .notif, .ready, .generating, .savings, .reminder,
                                                                .plan, .account, .email, .verify, .paywall, .done]

              init(entry: Entry = .signedOut) {
                  let saved = UserDefaults.standard.data(forKey: Self.storageKey)
                      .flatMap { try? JSONDecoder().decode(OnboardingAnswers.self, from: $0) }
                  let lastScreen = UserDefaults.standard.string(forKey: Self.screenKey).flatMap { Screen(rawValue: $0) }
                  let answeredAll = saved != nil && (saved?.reachedPlan == true || lastScreen.map { Self.afterQuestions.contains($0) } == true)

                  if entry == .lapsed {
                      a = saved ?? OnboardingAnswers()
                      paywallOnly = true
                      screen = .plan
                      needsRemoteAnswers = !answeredAll
                  } else if answeredAll, let saved {
                      a = saved
                      screen = .plan
                  } else {
                      // Fresh answers in memory; the old partial ones get overwritten as soon as they answer.
                      a = OnboardingAnswers()
                      screen = .landing
                      // Signed in on a new phone: their answers may be saved online.
                      needsRemoteAnswers = entry == .signedIn
                  }
              }

              /// Answers not on this device: load them from Supabase and show the plan.
              func restoreRemoteAnswersIfNeeded() async {
                  guard needsRemoteAnswers else { return }
                  needsRemoteAnswers = false
                  if let remote = await OnboardingSync.fetch(), remote.referral != nil {
                      a = remote
                      go(.plan)
                  } else if paywallOnly {
                      go(.paywall)
                  }
              }""")

          # Signing out forgets the local answers, so the next launch starts at "Get started".
          edit("ViewModels/AppStore.swift",
          """    func signOut() {
                  mutate { $0.account = nil }
              }""",
          """    func signOut() {
                  mutate { $0.account = nil }
                  OnboardingModel.clearSaved()
              }""")

          # Logging in to an existing account without a subscription -> personalized plan first.
          edit(O + "OnboardingAuth.swift",
          """                await upload(store, authState: "existing")
                          go(store.isPremium ? .done : .paywall)
                      } else {
                          authCtx = .new""",
          """                await upload(store, authState: "existing")
                          go(store.isPremium ? .done : .plan)
                      } else {
                          authCtx = .new""")

          def main(root="."):
              import os
              files = {}
              for path, old, new, count in EDITS:
                  p = os.path.join(root, path)
                  s = files.get(p) or open(p, encoding="utf-8").read()
                  n = s.count(old)
                  if n != count:
                      sys.exit(f"Anchor found {n}x (expected {count}) in {path}:\n{old[:120]}")
                  files[p] = s.replace(old, new)
              for p, s in files.items():
                  open(p, "w", encoding="utf-8").write(s)
                  print("edited", p)

          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-flow.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reopening the app: plan page if all questions are answered, otherwise Get started"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
