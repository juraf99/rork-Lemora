name: Smooth Discover and correct photos

# One-shot: cached recipe photos, prefetch, no stale image after swipe, catalogue cached on device. Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-smooth.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          cat > /tmp/edits.py <<'PYEOF'
          """Smooth Discover: cached, downsampled recipe photos (no stale image after a swipe), prefetch of the
          next cards, catalogue cached on the device, and the visible card pinned during background re-ranking."""
          import sys, os
          R = "ios-bitewise/Lemora/"
          PIPE = r'''import SwiftUI
          import UIKit
          import ImageIO

          /// Fast, cached loading for recipe photos hosted in Supabase Storage.
          /// - Memory cache of decoded, downsampled images (no re-decode when a card comes back).
          /// - Disk cache through URLCache (photos survive app restarts).
          /// - One download per URL even when several views ask at the same time.
          /// - Decoding happens off the main thread, so swiping stays smooth.
          nonisolated final class RemoteImagePipeline: @unchecked Sendable {
              static let shared = RemoteImagePipeline()

              private let cache = NSCache<NSURL, UIImage>()
              private let session: URLSession
              private let lock = NSLock()
              private var inFlight: [URL: Task<UIImage?, Never>] = [:]

              private init() {
                  cache.countLimit = 120
                  cache.totalCostLimit = 180 * 1024 * 1024
                  let config = URLSessionConfiguration.default
                  config.urlCache = URLCache(memoryCapacity: 16 * 1024 * 1024, diskCapacity: 400 * 1024 * 1024)
                  config.requestCachePolicy = .returnCacheDataElseLoad
                  config.httpMaximumConnectionsPerHost = 6
                  session = URLSession(configuration: config)
              }

              func cached(_ url: URL) -> UIImage? {
                  cache.object(forKey: url as NSURL)
              }

              func image(for url: URL) async -> UIImage? {
                  if let hit = cached(url) { return hit }
                  let task: Task<UIImage?, Never> = lock.withLock {
                      if let existing = inFlight[url] { return existing }
                      let session = self.session
                      let created = Task.detached(priority: .userInitiated) { () -> UIImage? in
                          guard let (data, response) = try? await session.data(from: url),
                                (response as? HTTPURLResponse).map({ (200..<300).contains($0.statusCode) }) ?? true
                          else { return nil }
                          return RemoteImagePipeline.downsample(data, maxPixel: 1080)
                      }
                      inFlight[url] = created
                      return created
                  }
                  let image = await task.value
                  lock.withLock { inFlight[url] = nil }
                  if let image {
                      let cost = Int(image.size.width * image.size.height * image.scale * image.scale * 4)
                      cache.setObject(image, forKey: url as NSURL, cost: cost)
                  }
                  return image
              }

              /// Warms the cache for the next cards so they appear instantly when swiped in.
              func prefetch(_ urls: [URL]) {
                  for url in urls where cached(url) == nil {
                      Task.detached(priority: .utility) { _ = await RemoteImagePipeline.shared.image(for: url) }
                  }
              }

              private static func downsample(_ data: Data, maxPixel: CGFloat) -> UIImage? {
                  let sourceOptions = [kCGImageSourceShouldCache: false] as CFDictionary
                  guard let source = CGImageSourceCreateWithData(data as CFData, sourceOptions) else { return nil }
                  let options = [
                      kCGImageSourceCreateThumbnailFromImageAlways: true,
                      kCGImageSourceShouldCacheImmediately: true,
                      kCGImageSourceCreateThumbnailWithTransform: true,
                      kCGImageSourceThumbnailMaxPixelSize: maxPixel,
                  ] as CFDictionary
                  guard let cgImage = CGImageSourceCreateThumbnailAtIndex(source, 0, options) else { return nil }
                  return UIImage(cgImage: cgImage)
              }
          }

          /// Remote recipe photo. Shows the cached image immediately when available and never shows
          /// a previous recipe's photo: each URL gets its own view identity (see `FoodImage`).
          struct RemoteFoodImage: View {
              let url: URL
              @State private var image: UIImage?
              @State private var failed = false

              init(url: URL) {
                  self.url = url
                  _image = State(initialValue: RemoteImagePipeline.shared.cached(url))
              }

              var body: some View {
                  ZStack {
                      if let image {
                          Image(uiImage: image)
                              .resizable()
                              .aspectRatio(contentMode: .fill)
                              .transition(.opacity)
                      } else if failed {
                          Image(systemName: "fork.knife").font(.largeTitle).foregroundStyle(BW.inkSecondary)
                      } else {
                          ProgressView().tint(BW.leaf)
                      }
                  }
                  .task(id: url) {
                      guard image == nil else { return }
                      let loaded = await RemoteImagePipeline.shared.image(for: url)
                      withAnimation(.easeOut(duration: 0.18)) {
                          image = loaded
                          failed = loaded == nil
                      }
                  }
              }
          }
          '''
          EDITS = [('Views/Components/Components.swift', '                if let url = URL(string: name), url.scheme == "https" {\n                    AsyncImage(url: url) { phase in\n                        switch phase {\n                        case .success(let image): image.resizable().aspectRatio(contentMode: .fill)\n                        case .failure: Image(systemName: "fork.knife").font(.largeTitle).foregroundStyle(BW.inkSecondary)\n                        default: ProgressView().tint(BW.leaf)\n                        }\n                    }\n                    .allowsHitTesting(false)', '                if let url = URL(string: name), url.scheme == "https" {\n                    RemoteFoodImage(url: url)\n                        .id(url)\n                        .allowsHitTesting(false)'), ('Services/SupabaseService.swift', '    func fetchRecipeCatalogue() async throws -> [Recipe] {\n        let rows: [RemoteRecipeEnvelope] = try await client\n            .rpc("get_lemora_recipe_catalog")\n            .execute()\n            .value\n        let recipes = rows.compactMap(\\.recipe)\n        logger.info("Loaded \\(recipes.count) recipes from the permanent catalogue")\n        return recipes\n    }', '    /// Fetches the catalogue and caches the raw response on the device. `changed` is false when the\n    /// response is identical to the cached copy, so the app can keep its current cards untouched.\n    func fetchRecipeCatalogue() async throws -> (recipes: [Recipe], changed: Bool) {\n        let data = try await client\n            .rpc("get_lemora_recipe_catalog")\n            .execute()\n            .data\n        let rows = try JSONDecoder().decode([RemoteRecipeEnvelope].self, from: data)\n        let recipes = rows.compactMap(\\.recipe)\n        let cacheURL = Self.recipeCatalogueCacheURL\n        let changed = (try? Data(contentsOf: cacheURL)) != data\n        if changed && !recipes.isEmpty { try? data.write(to: cacheURL, options: .atomic) }\n        logger.info("Loaded \\(recipes.count) recipes from the permanent catalogue (changed: \\(changed))")\n        return (recipes, changed)\n    }\n\n    nonisolated static var recipeCatalogueCacheURL: URL {\n        FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask)[0]\n            .appendingPathComponent("lemora-recipe-catalogue-v1.json")\n    }\n\n    /// Recipes from the last successful download, available instantly at launch (empty if none).\n    nonisolated static func cachedRecipeCatalogue() -> [Recipe] {\n        guard let data = try? Data(contentsOf: recipeCatalogueCacheURL),\n              let rows = try? JSONDecoder().decode([RemoteRecipeEnvelope].self, from: data) else { return [] }\n        return rows.compactMap(\\.recipe)\n    }'), ('ViewModels/AppStore.swift', '    private(set) var recipes: [Recipe] = RecipeCatalog.all\n', '    private(set) var recipes: [Recipe] = AppStore.launchRecipes()\n    private var catalogueFromCache: Bool = FileManager.default.fileExists(atPath: SupabaseService.recipeCatalogueCacheURL.path)\n\n    /// Cached catalogue (instant, no reshuffle at launch) plus the bundled original recipes.\n    private static func launchRecipes() -> [Recipe] {\n        let cached = SupabaseService.cachedRecipeCatalogue()\n        guard !cached.isEmpty else { return RecipeCatalog.all }\n        let ids = Set(cached.map(\\.id))\n        return cached + RecipeCatalog.all.filter { !ids.contains($0.id) }\n    }\n'), ('ViewModels/AppStore.swift', '            let fetched = try await SupabaseService.shared.fetchRecipeCatalogue()\n            if !fetched.isEmpty {\n                let fetchedIds = Set(fetched.map(\\.id))\n                recipes = fetched + RecipeCatalog.all.filter { !fetchedIds.contains($0.id) }\n            }\n            recipeCatalogueLoaded = true\n            recipeCatalogueError = nil\n            refreshRanking()', '            let result = try await SupabaseService.shared.fetchRecipeCatalogue()\n            let fetched = result.recipes\n            if !fetched.isEmpty && (result.changed || !catalogueFromCache) {\n                let fetchedIds = Set(fetched.map(\\.id))\n                recipes = fetched + RecipeCatalog.all.filter { !fetchedIds.contains($0.id) }\n                refreshRanking()\n            }\n            catalogueFromCache = true\n            recipeCatalogueLoaded = true\n            recipeCatalogueError = nil'), ('Views/Discover/DiscoverView.swift', '    private var queue: [ScoredRecipe] { store.discoverQueue }', '    /// The card on screen stays on screen even if deals or the catalogue re-rank the queue in the background.\n    @State private var pinnedId: String? = nil\n\n    private var queue: [ScoredRecipe] {\n        let q = store.discoverQueue\n        guard let pinnedId, let idx = q.firstIndex(where: { $0.id == pinnedId }), idx > 0 else { return q }\n        var out = q\n        out.insert(out.remove(at: idx), at: 0)\n        return out\n    }\n\n    private func prefetchNextImages() {\n        let urls = queue.prefix(6).compactMap { URL(string: $0.recipe.imageName) }.filter { $0.scheme == "https" }\n        RemoteImagePipeline.shared.prefetch(urls)\n    }'), ('Views/Discover/DiscoverView.swift', '            store.swipe(item, direction)\n            drag = .zero\n            flyOut = nil', '            store.swipe(item, direction)\n            pinnedId = store.discoverQueue.first?.id\n            drag = .zero\n            flyOut = nil\n            prefetchNextImages()'), ('Views/Discover/DiscoverView.swift', '            .onAppear { store.track("discover_opened") }', '            .onAppear {\n                store.track("discover_opened")\n                if pinnedId == nil { pinnedId = store.discoverQueue.first?.id }\n                prefetchNextImages()\n            }\n            .onChange(of: store.discoverQueue.count) { _, _ in prefetchNextImages() }'), ('Views/Discover/DiscoverView.swift', '            RecipeSwipeCard(item: top, showWhy: $showWhy)\n', '            RecipeSwipeCard(item: top, showWhy: $showWhy)\n                .id(top.id)\n')]
          def main(root="."):
              for path, old, new in EDITS:
                  p = os.path.join(root, R + path)
                  s = open(p, encoding="utf-8").read()
                  if s.count(old) != 1:
                      sys.exit(f"Anchor count {s.count(old)} in {path}: {old[:70]!r}")
                  open(p, "w", encoding="utf-8").write(s.replace(old, new))
                  print("edited", p)
              p = os.path.join(root, R + "Utilities/RemoteImagePipeline.swift")
              if os.path.exists(p):
                  sys.exit("RemoteImagePipeline.swift already exists")
              open(p, "w", encoding="utf-8").write(PIPE)
              print("created", p)
          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-smooth.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Smooth Discover: cached photos, prefetch, no stale image after swipe, cached catalogue"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
