name: TestFlight

# Builds the Lemora iOS app and uploads it to TestFlight.
# Runs on every push to main that touches the iOS app, or manually (Actions > TestFlight > Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'ios-bitewise/**'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  TEAM_ID: CV768N46QD
  PROJECT: ios-bitewise/Lemora.xcodeproj
  SCHEME: Lemora

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          BODY=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/\\n/ /g' -e 's/-----BEGIN[A-Z ]*-----//' -e 's/-----END[A-Z ]*-----//' | tr -d ' \r\n\t')
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$BODY" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "Key body length: ${#BODY}"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Each CI run makes a throwaway "Apple Development" certificate (the runner has no
      # private key to reuse). Apple caps how many can exist, so revoke the ones earlier
      # CI runs left behind ("Created via API"). Certificates made on a Mac are not touched.
      - name: Revoke leftover CI development certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" install --quiet pyjwt cryptography
          cat > "$RUNNER_TEMP/revoke_ci_certs.py" <<'PY'
          import json, os, time, urllib.request
          import jwt
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          now = int(time.time())
          tok = jwt.encode({"iss": iss, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          def call(method, url):
              req = urllib.request.Request(url, method=method, headers={"Authorization": "Bearer " + tok})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else None
          certs = call("GET", "https://api.appstoreconnect.apple.com/v1/certificates?limit=200")["data"]
          for c in certs:
              a = c["attributes"]
              label = f'{a.get("certificateType")} | {a.get("name")} | {a.get("displayName")} | expires {a.get("expirationDate")}'
              is_dev = a.get("certificateType") in ("DEVELOPMENT", "IOS_DEVELOPMENT")
              from_ci = "Created via API" in f'{a.get("name") or ""} {a.get("displayName") or ""}'
              if is_dev and from_ci:
                  call("DELETE", f'https://api.appstoreconnect.apple.com/v1/certificates/{c["id"]}')
                  print("revoked :", label)
              else:
                  print("kept    :", label)
          PY
          "$RUNNER_TEMP/asc/bin/python" "$RUNNER_TEMP/revoke_ci_certs.py"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          echo "Build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lemora.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lemora.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Revoke the throwaway certificate this run just created, so they never pile up again.
      - name: Revoke this run's CI certificate
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/revoke_ci_certs.py" ]; then "$RUNNER_TEMP/asc/bin/python" "$RUNNER_TEMP/revoke_ci_certs.py" || true; fi

      - name: Remove API key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
