name: TestFlight

# Builds the Lemora iOS app and uploads it to TestFlight.
# Runs on every push to main that touches the iOS app, or manually (Actions > TestFlight > Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'ios-bitewise/**'
      - '.github/workflows/testflight_1.yml'
      - 'scripts/check-integration.mjs'
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

env:
  TEAM_ID: CV768N46QD
  PROJECT: ios-bitewise/Lemora.xcodeproj
  SCHEME: Lemora

jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Verify integrated onboarding and Ask
        run: node scripts/check-integration.mjs

      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          BODY=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/\\n/ /g' -e 's/-----BEGIN[A-Z ]*-----//' -e 's/-----END[A-Z ]*-----//' | tr -d ' \r\n\t')
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$BODY" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "Key body length: ${#BODY}"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Remove at most one stale certificate made by a previous ephemeral API runner,
      # then record the remaining IDs. Certificates created on a developer Mac are kept.
      # Final cleanup may only revoke the new certificate embedded in this run's archive.
      - name: Prepare signing certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" install --quiet pyjwt cryptography
          cat > "$RUNNER_TEMP/revoke_ci_certs.py" <<'PY'
          import base64, hashlib, json, os, sys, time, urllib.request
          import jwt
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          now = int(time.time())
          tok = jwt.encode({"iss": iss, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          def call(method, url):
              req = urllib.request.Request(url, method=method, headers={"Authorization": "Bearer " + tok})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else None
          certificates_url = "https://api.appstoreconnect.apple.com/v1/certificates?limit=200"
          certs = call("GET", certificates_url)["data"]
          snapshot = os.path.join(os.environ["RUNNER_TEMP"], "lemora-existing-certificates.json")
          if sys.argv[1] == "record":
              stale_ci = []
              for c in certs:
                  a = c["attributes"]
                  labels = {a.get("name"), a.get("displayName")}
                  is_dev = a.get("certificateType") in ("DEVELOPMENT", "IOS_DEVELOPMENT")
                  if is_dev and "Created via API" in labels:
                      stale_ci.append(c)
              if stale_ci:
                  stale = min(stale_ci, key=lambda c: c["attributes"].get("expirationDate") or "")
                  call("DELETE", f'https://api.appstoreconnect.apple.com/v1/certificates/{stale["id"]}')
                  print("Revoked one stale development certificate created by an earlier API runner.")
                  certs = call("GET", certificates_url)["data"]
              with open(snapshot, "w") as f:
                  json.dump([c["id"] for c in certs], f)
              print("Recorded existing certificate IDs; none revoked.")
              sys.exit(0)
          certificate = os.path.join(os.environ["RUNNER_TEMP"], "lemora-signing-0")
          if not os.path.isfile(snapshot) or not os.path.isfile(certificate):
              print("No complete signing snapshot/archive; skipping certificate cleanup.")
              sys.exit(0)
          existing = set(json.load(open(snapshot)))
          fingerprint = hashlib.sha256(open(certificate, "rb").read()).digest()
          for c in certs:
              a = c["attributes"]
              is_signing = a.get("certificateType") in (
                  "DEVELOPMENT", "IOS_DEVELOPMENT", "DISTRIBUTION", "IOS_DISTRIBUTION"
              )
              content = base64.b64decode(a.get("certificateContent") or "")
              matches_archive = hashlib.sha256(content).digest() == fingerprint
              if is_signing and c["id"] not in existing and matches_archive:
                  call("DELETE", f'https://api.appstoreconnect.apple.com/v1/certificates/{c["id"]}')
                  print("Revoked only this run's newly created archive-signing certificate.")
          PY
          "$RUNNER_TEMP/asc/bin/python" "$RUNNER_TEMP/revoke_ci_certs.py" record

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          LATEST_MAIN=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$LATEST_MAIN" != "$GITHUB_SHA" ]; then
            echo "::error::Main changed since this run started. The latest integrated commit must be built."
            exit 1
          fi
          BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          echo "Build number: $BUILD_NUMBER"
          echo "LEMORA_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          {
            echo "### Lemora integrated release"
            echo "- Source commit: $GITHUB_SHA"
            echo "- TestFlight build: $BUILD_NUMBER"
            echo "- Source branch: $GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lemora.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          LATEST_MAIN=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$LATEST_MAIN" != "$GITHUB_SHA" ]; then
            echo "::error::Main changed during the archive. Skipping this outdated upload."
            exit 1
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lemora.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "- Upload: completed successfully (Apple processing still required)" >> "$GITHUB_STEP_SUMMARY"

      # Revoke the throwaway certificate this run just created, so they never pile up again.
      - name: Revoke this run's CI certificate
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/revoke_ci_certs.py" ]; then
            codesign -d --extract-certificates "$RUNNER_TEMP/lemora-signing-" "$RUNNER_TEMP/Lemora.xcarchive/Products/Applications/Lemora.app" || true
            "$RUNNER_TEMP/asc/bin/python" "$RUNNER_TEMP/revoke_ci_certs.py" cleanup || true
          fi

      - name: Remove API key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
