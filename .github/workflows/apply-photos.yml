name: Instant recipe photos

# One-shot: recipe photos bundled in the app, launch preload, deeper prefetch. Commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-photos.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          python3 -m pip install --quiet pillow
          cat > /tmp/edits.py <<'PYEOF'
          """Swipes never show a loader: catalogue photos ship inside the app (860 px WebP), launch screen preloads the
          first cards, and the next 14 cards are decoded ahead."""
          import sys, os, json, io, urllib.request
          R = "ios-bitewise/Lemora/"
          PIPE = r'''import SwiftUI
          import UIKit
          import ImageIO

          /// Recipe photos that never show a spinner while swiping.
          /// 1. Photos of the permanent catalogue ship inside the app (Resources/RecipePhotos, ~860 px WebP):
          ///    they open instantly, even offline.
          /// 2. Decoded images stay in memory, so a card that comes back is immediate.
          /// 3. Photos not in the app (new recipes) are downloaded once, kept on disk, and prefetched ahead.
          /// Decoding happens off the main thread whenever possible.
          nonisolated final class RemoteImagePipeline: @unchecked Sendable {
              static let shared = RemoteImagePipeline()

              private let cache = NSCache<NSURL, UIImage>()
              private let session: URLSession
              private let lock = NSLock()
              private var inFlight: [URL: Task<UIImage?, Never>] = [:]

              private init() {
                  cache.countLimit = 160
                  cache.totalCostLimit = 220 * 1024 * 1024
                  let config = URLSessionConfiguration.default
                  config.urlCache = URLCache(memoryCapacity: 16 * 1024 * 1024, diskCapacity: 400 * 1024 * 1024)
                  config.requestCachePolicy = .returnCacheDataElseLoad
                  config.httpMaximumConnectionsPerHost = 6
                  session = URLSession(configuration: config)
              }

              // MARK: Lookup

              func cached(_ url: URL) -> UIImage? {
                  cache.object(forKey: url as NSURL)
              }

              /// Bundled copy of a catalogue photo: ".../catalogue/<id>.webp" -> "recipe-<id>.webp" in the app.
              static func bundledFile(for url: URL) -> URL? {
                  let id = url.deletingPathExtension().lastPathComponent
                  guard !id.isEmpty else { return nil }
                  return Bundle.main.url(forResource: "recipe-\(id)", withExtension: "webp")
              }

              /// Memory cache, else the photo shipped in the app (decoded right away). Never touches the network.
              func immediate(_ url: URL) -> UIImage? {
                  if let hit = cached(url) { return hit }
                  guard let file = Self.bundledFile(for: url),
                        let data = try? Data(contentsOf: file),
                        let image = Self.decode(data) else { return nil }
                  store(image, for: url)
                  return image
              }

              func image(for url: URL) async -> UIImage? {
                  if let hit = cached(url) { return hit }
                  let task: Task<UIImage?, Never> = lock.withLock {
                      if let existing = inFlight[url] { return existing }
                      let session = self.session
                      let created = Task.detached(priority: .userInitiated) { () -> UIImage? in
                          if let file = RemoteImagePipeline.bundledFile(for: url), let data = try? Data(contentsOf: file) {
                              return RemoteImagePipeline.decode(data)
                          }
                          guard let (data, response) = try? await session.data(from: url),
                                (response as? HTTPURLResponse).map({ (200..<300).contains($0.statusCode) }) ?? true
                          else { return nil }
                          return RemoteImagePipeline.decode(data)
                      }
                      inFlight[url] = created
                      return created
                  }
                  let image = await task.value
                  lock.withLock { inFlight[url] = nil }
                  if let image { store(image, for: url) }
                  return image
              }

              // MARK: Warm-up

              /// Warms the cache for the next cards so they appear instantly when swiped in.
              func prefetch(_ urls: [URL]) {
                  for url in urls where cached(url) == nil {
                      Task.detached(priority: .utility) { _ = await RemoteImagePipeline.shared.image(for: url) }
                  }
              }

              /// Used during the launch screen: waits until these photos are ready (or the timeout passes).
              func preload(_ urls: [URL], timeout: Duration) async {
                  let missing = urls.filter { cached($0) == nil }
                  guard !missing.isEmpty else { return }
                  for url in missing {
                      Task.detached(priority: .userInitiated) { _ = await RemoteImagePipeline.shared.image(for: url) }
                  }
                  let clock = ContinuousClock()
                  let deadline = clock.now.advanced(by: timeout)
                  while clock.now < deadline {
                      if missing.allSatisfy({ cached($0) != nil }) { return }
                      try? await Task.sleep(for: .milliseconds(40))
                  }
              }

              // MARK: Private

              private func store(_ image: UIImage, for url: URL) {
                  let cost = Int(image.size.width * image.size.height * image.scale * image.scale * 4)
                  cache.setObject(image, forKey: url as NSURL, cost: cost)
              }

              private static func decode(_ data: Data, maxPixel: CGFloat = 1080) -> UIImage? {
                  let sourceOptions = [kCGImageSourceShouldCache: false] as CFDictionary
                  guard let source = CGImageSourceCreateWithData(data as CFData, sourceOptions) else { return nil }
                  let options = [
                      kCGImageSourceCreateThumbnailFromImageAlways: true,
                      kCGImageSourceShouldCacheImmediately: true,
                      kCGImageSourceCreateThumbnailWithTransform: true,
                      kCGImageSourceThumbnailMaxPixelSize: maxPixel,
                  ] as CFDictionary
                  guard let cgImage = CGImageSourceCreateThumbnailAtIndex(source, 0, options) else { return nil }
                  return UIImage(cgImage: cgImage)
              }
          }

          /// Recipe photo. Shows the in-app or cached image on the very first frame; each URL gets its own
          /// view identity (see `FoodImage`), so a previous recipe's photo can never appear.
          struct RemoteFoodImage: View {
              let url: URL
              @State private var image: UIImage?
              @State private var failed = false

              init(url: URL) {
                  self.url = url
                  _image = State(initialValue: RemoteImagePipeline.shared.immediate(url))
              }

              var body: some View {
                  ZStack {
                      if let image {
                          Image(uiImage: image)
                              .resizable()
                              .aspectRatio(contentMode: .fill)
                      } else if failed {
                          Image(systemName: "fork.knife").font(.largeTitle).foregroundStyle(BW.inkSecondary)
                      } else {
                          // Soft placeholder instead of a spinner (only for brand-new recipes not shipped in the app).
                          LinearGradient(colors: [BW.beige, BW.beigeSoft], startPoint: .topLeading, endPoint: .bottomTrailing)
                      }
                  }
                  .task(id: url) {
                      guard image == nil else { return }
                      let loaded = await RemoteImagePipeline.shared.image(for: url)
                      withAnimation(.easeOut(duration: 0.18)) {
                          image = loaded
                          failed = loaded == nil
                      }
                  }
              }
          }
          '''
          EDITS = [('ContentView.swift', '            await store.bootstrap()\n            try? await Task.sleep(for: .milliseconds(900))\n', '            await store.bootstrap()\n            // Launch screen stays until the first Discover photos are decoded (max 4 s), so swiping starts smooth.\n            let firstPhotos = store.discoverQueue.prefix(10).compactMap { URL(string: $0.recipe.imageName) }.filter { $0.scheme == "https" }\n            await RemoteImagePipeline.shared.preload(firstPhotos, timeout: .seconds(4))\n            try? await Task.sleep(for: .milliseconds(300))\n'), ('Views/Discover/DiscoverView.swift', '        let urls = queue.prefix(6).compactMap { URL(string: $0.recipe.imageName) }.filter { $0.scheme == "https" }', '        let urls = queue.prefix(14).compactMap { URL(string: $0.recipe.imageName) }.filter { $0.scheme == "https" }')]
          PIPE_MARK = "nonisolated final class RemoteImagePipeline"
          RPC = "https://fsucqlqsafoligouzgrl.supabase.co/rest/v1/rpc/get_lemora_recipe_catalog"
          KEY = "sb_publishable_2iPvFh4m-T-1oG-s84VOzw_1H4R9T3G"

          def bundle_photos(root):
              from PIL import Image
              from concurrent.futures import ThreadPoolExecutor
              out_dir = os.path.join(root, R + "Resources/RecipePhotos")
              os.makedirs(out_dir, exist_ok=True)
              req = urllib.request.Request(RPC, data=b"{}", method="POST",
                                           headers={"apikey": KEY, "Content-Type": "application/json"})
              rows = json.load(urllib.request.urlopen(req, timeout=60))
              def work(row):
                  url = row["image_url"]
                  rid = url.rsplit("/", 1)[-1].rsplit(".", 1)[0]
                  dest = os.path.join(out_dir, f"recipe-{rid}.webp")
                  data = urllib.request.urlopen(url, timeout=120).read()
                  im = Image.open(io.BytesIO(data)).convert("RGB")
                  im.thumbnail((860, 860), Image.LANCZOS)
                  im.save(dest, "WEBP", quality=74, method=6)
                  return os.path.getsize(dest)
              with ThreadPoolExecutor(12) as ex:
                  sizes = list(ex.map(work, rows))
              if len(sizes) < 250:
                  sys.exit(f"Only {len(sizes)} photos bundled")
              print(f"bundled {len(sizes)} photos, {sum(sizes)/1e6:.1f} MB")

          def main(root="."):
              for path, old, new in EDITS:
                  p = os.path.join(root, R + path)
                  s = open(p, encoding="utf-8").read()
                  if s.count(old) != 1:
                      sys.exit(f"Anchor count {s.count(old)} in {path}: {old[:70]!r}")
                  open(p, "w", encoding="utf-8").write(s.replace(old, new))
                  print("edited", p)
              p = os.path.join(root, R + "Utilities/RemoteImagePipeline.swift")
              if PIPE_MARK not in open(p, encoding="utf-8").read():
                  sys.exit("RemoteImagePipeline marker missing")
              open(p, "w", encoding="utf-8").write(PIPE)
              print("replaced", p)
              bundle_photos(root)

          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-photos.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Instant swipes: bundled recipe photos, launch preload, deeper prefetch"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
