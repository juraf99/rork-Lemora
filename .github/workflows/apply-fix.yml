name: Lemora fix

# One-shot: applies the app changes, COMPILES them on a Mac, and only then commits and starts
# a TestFlight build. A compile error is published as an annotation and nothing is pushed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Edit the Swift files
        run: |
          set -e
          echo '' | base64 -d | gunzip > /tmp/edits.py
          python3 /tmp/edits.py ios-bitewise/Lemora

      - name: Compile check
        run: |
          set -o pipefail
          cd ios-bitewise
          xcodebuild build \
            -project Lemora.xcodeproj \
            -scheme Lemora \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show compile errors
        if: failure()
        run: |
          # Published as annotations so the errors are readable on the run page.
          grep -E "error:" "$RUNNER_TEMP/build.log" | sed 's|.*/Lemora/||' | sort -u | head -40 \
            | while IFS= read -r line; do echo "::error::$line"; done

      - name: Commit and push
        run: |
          # The workflow file itself is left in place: deleting it needs a permission the build token
          # does not have, and it only ever runs again if that same file is uploaded again.
          { echo "### Commit and push"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Xcode scratch files from the compile check never belong in the repo.
          rm -rf ios-bitewise/Lemora.xcodeproj/project.xcworkspace/xcuserdata \
                 ios-bitewise/Lemora.xcodeproj/xcuserdata 2>/dev/null || true
          git add -A
          git status --short | head -40 | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Australia (Woolworths + Coles weekly specials, 4-digit postcodes, AUD); in-app language (English, French, Spanish); nearby stores always follow the entered location; Ask hides the message count and shows photos of Lemora recipes" 2>&1 | tail -4 | tee -a "$GITHUB_STEP_SUMMARY"
          COMMIT_RC=${PIPESTATUS[0]}
          git push 2>&1 | tail -8 | tee -a "$GITHUB_STEP_SUMMARY"
          PUSH_RC=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # The exact git message is in the run summary above, which is readable without signing in.
          if [ "$COMMIT_RC" != 0 ] || [ "$PUSH_RC" != 0 ]; then
            echo "::error::git commit exit $COMMIT_RC, git push exit $PUSH_RC - see the run summary"
            exit 1
          fi

      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
