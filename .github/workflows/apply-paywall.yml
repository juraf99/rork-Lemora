name: Fix paywall layout

# One-shot: paywall back to the design (normal CTA, yearly/monthly side by side, 🔓 🔔 ⭐ emojis).
# Commits, starts the TestFlight build, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-paywall.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          cat > /tmp/edits.py <<'PYEOF'
          """Paywall back to the design: normal-size CTA (the shine was stretching it), yearly/monthly cards side by side
          (1.25 : 1 like the design), and the same clean emojis (🔓 🔔 ⭐) in every timeline."""
          import sys

          R = "ios-bitewise/Lemora/"
          EDITS = []

          def edit(path, old, new, count=1):
              EDITS.append((R + path, old, new, count))

          O = "Views/Onboarding/"

          # The sheen used a GeometryReader inside the label, which made the yellow button grow to fill the screen.
          edit(O + "OnboardingStyle.swift",
          """            ZStack {
                          if shine && enabled { OBSheen() }
                          Text(title)""",
          """            ZStack {
                          Text(title)""")

          edit(O + "OnboardingStyle.swift",
          """            .background(enabled ? OB.lemon : OB.track, in: .capsule)
                      .clipShape(.capsule)
                      .shadow(color: enabled ? OB.lemon.opacity(0.4) : .clear, radius: 8, x: 0, y: 6)""",
          """            .background(enabled ? OB.lemon : OB.track, in: .capsule)
                      .overlay { if shine && enabled { OBSheen() } }
                      .clipShape(.capsule)
                      .shadow(color: enabled ? OB.lemon.opacity(0.4) : .clear, radius: 8, x: 0, y: 6)""")

          edit(O + "OnboardingStyle.swift",
          """struct OBPrimaryButton: View {""",
          """/// Lays children out side by side with widths in proportion to `weights` (CSS flex: 1.25 / 1)
          /// and the same height (CSS align-items: stretch).
          struct OBWeightedRow: Layout {
              var weights: [CGFloat]
              var spacing: CGFloat = 10

              private func widths(_ total: CGFloat, _ n: Int) -> [CGFloat] {
                  let w = (0..<n).map { $0 < weights.count ? weights[$0] : 1 }
                  let sum = w.reduce(0, +)
                  let free = max(0, total - spacing * CGFloat(max(0, n - 1)))
                  return w.map { free * $0 / sum }
              }

              func sizeThatFits(proposal: ProposedViewSize, subviews: Subviews, cache: inout ()) -> CGSize {
                  let total = proposal.width ?? 350
                  let ws = widths(total, subviews.count)
                  let h = zip(subviews, ws).map { $0.sizeThatFits(ProposedViewSize(width: $1, height: nil)).height }.max() ?? 0
                  return CGSize(width: total, height: h)
              }

              func placeSubviews(in bounds: CGRect, proposal: ProposedViewSize, subviews: Subviews, cache: inout ()) {
                  let ws = widths(bounds.width, subviews.count)
                  var x = bounds.minX
                  for (sv, w) in zip(subviews, ws) {
                      sv.place(at: CGPoint(x: x, y: bounds.minY), anchor: .topLeading,
                               proposal: ProposedViewSize(width: w, height: bounds.height))
                      x += w + spacing
                  }
              }
          }

          struct OBPrimaryButton: View {""")

          # Same clean emojis as the trial version (🔓 🔔 ⭐) when there is no free trial.
          edit(O + "OnboardingFinal.swift",
          """        if annual {
                      return [("🔓", "Today", "Everything unlocked · \\(annualPrice) billed"),
                              ("🔁", "Every year", "Renews at \\(annualPrice)"),
                              ("✨", "Anytime", "Cancel in Settings in two taps")]
                  }
                  return [("🔓", "Today", "Everything unlocked · \\(monthlyPrice) billed"),
                          ("🔁", "Every month", "Renews at \\(monthlyPrice)"),
                          ("✨", "Anytime", "Cancel in Settings in two taps")]""",
          """        if annual {
                      return [("🔓", "Today", "Everything unlocked · \\(annualPrice) billed"),
                              ("🔔", "Every year", "Renews at \\(annualPrice)"),
                              ("⭐", "Anytime", "Cancel in Settings in two taps")]
                  }
                  return [("🔓", "Today", "Everything unlocked · \\(monthlyPrice) billed"),
                          ("🔔", "Every month", "Renews at \\(monthlyPrice)"),
                          ("⭐", "Anytime", "Cancel in Settings in two taps")]""")

          # Yearly and monthly cards side by side (the monthly card was squashed to a sliver).
          edit(O + "OnboardingFinal.swift",
          """                HStack(alignment: .bottom, spacing: 10) {
                              planCard(id: "annual", name: "Yearly", price: annualPrice, unit: "\\(perMonth) / month",
                                       terms: trialDays.map { "\\($0) days free" } ?? "Billed yearly",
                                       badge: savePercent > 0 ? "BEST VALUE · −\\(savePercent)%" : "BEST VALUE")
                                  .layoutPriority(1.25)
                              planCard(id: "monthly", name: "Monthly", price: monthlyPrice, unit: "per month", terms: "No trial", badge: nil)
                          }""",
          """                OBWeightedRow(weights: [1.25, 1], spacing: 10) {
                              planCard(id: "annual", name: "Yearly", price: annualPrice, unit: "\\(perMonth) / month",
                                       terms: trialDays.map { "\\($0) days free" } ?? "Billed yearly",
                                       badge: savePercent > 0 ? "BEST VALUE · −\\(savePercent)%" : "BEST VALUE")
                              planCard(id: "monthly", name: "Monthly", price: monthlyPrice, unit: "per month", terms: "No trial", badge: nil)
                          }
                          .padding(.top, 11)""")

          edit(O + "OnboardingFinal.swift",
          """                Text(terms).font(OB.font(11.5, 700)).foregroundStyle(on ? OB.lemon : OB.green).padding(.top, 8)
                      }
                      .frame(maxWidth: .infinity, alignment: .leading)""",
          """                Text(terms).font(OB.font(11.5, 700)).foregroundStyle(on ? OB.lemon : OB.green).padding(.top, 8)
                      }
                      .frame(maxWidth: .infinity, maxHeight: .infinity, alignment: .topLeading)""")

          def main(root="."):
              import os
              files = {}
              for path, old, new, count in EDITS:
                  p = os.path.join(root, path)
                  s = files.get(p) or open(p, encoding="utf-8").read()
                  n = s.count(old)
                  if n != count:
                      sys.exit(f"Anchor found {n}x (expected {count}) in {path}:\n{old[:120]}")
                  files[p] = s.replace(old, new)
              for p, s in files.items():
                  open(p, "w", encoding="utf-8").write(s)
                  print("edited", p)

          if __name__ == "__main__":
              main(*sys.argv[1:])
          PYEOF
          python3 /tmp/edits.py .
          git rm -f .github/workflows/apply-paywall.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Paywall matches the design: normal-size CTA, yearly and monthly side by side, same timeline emojis"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
