        run: |
          set -e
          mkdir -p /tmp/offer
          printf '%s' "$BUNDLE" | tr -d ' \t\n\r' | base64 -d | tar xzf - -C /tmp/offer
          python3 /tmp/offer/patch.py ios-bitewise/Lemora /tmp/offer/ExitOffer.swift /tmp/offer/tr.json

      - name: Compile check
        run: |
          set -o pipefail
          cd ios-bitewise
          xcodebuild build \
            -project Lemora.xcodeproj \
            -scheme Lemora \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "error:" "$RUNNER_TEMP/build.log" | sed 's|.*/Lemora/||' | sort -u | head -40 \
            | while IFS= read -r line; do echo "::error::$line"; done

      - name: Commit and push
        run: |
          { echo "### Commit and push"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm -rf ios-bitewise/Lemora.xcodeproj/project.xcworkspace/xcuserdata \
                 ios-bitewise/Lemora.xcodeproj/xcuserdata 2>/dev/null || true
          git add -A
          git status --short | head -40 | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "One-time special offer when leaving the paywall (exit-intent): offer product, animated countdown screen, localized FR/ES, RevenueCat + App Store Connect" 2>&1 | tail -4 | tee -a "$GITHUB_STEP_SUMMARY"
          COMMIT_RC=${PIPESTATUS[0]}
          git push 2>&1 | tail -8 | tee -a "$GITHUB_STEP_SUMMARY"
          PUSH_RC=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$COMMIT_RC" != 0 ] || [ "$PUSH_RC" != 0 ]; then
            echo "::error::git commit exit $COMMIT_RC, git push exit $PUSH_RC - see the run summary"
            exit 1
          fi

      - name: App Store Connect - create the special offer
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          BODY=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/\\n/ /g' -e 's/-----BEGIN[A-Z ]*-----//' -e 's/-----END[A-Z ]*-----//' | tr -d ' \r\n\t')
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$BODY" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/asc/bin/python" /tmp/offer/asc_offer.py /tmp/offer/review.png || echo "::warning::App Store Connect step reported problems - see the run summary"
          rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
