name: Lemora offer

# One-shot: adds the one-time special offer (exit-intent paywall) to the app, COMPILES it on a Mac,
# commits only if it builds, creates the offer product in App Store Connect, and starts a TestFlight build.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-offer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

