name: Lemora haptics

# One-shot: applies the launch fixes (skips what is already applied) + always-current deals, commits, starts TestFlight, deletes itself.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-all.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the Swift files
        run: |
          set -e
          echo '' | base64 -d | gunzip > /tmp/edits.py
          python3 /tmp/edits.py ios-bitewise/Lemora
          git rm -f .github/workflows/apply-all.yml
          git add -A
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Haptics: tab bar, every onboarding and profile choice, screen changes, pressable buttons"
          git push
      - name: Start TestFlight build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight_1.yml --ref main --repo "${{ github.repository }}"
